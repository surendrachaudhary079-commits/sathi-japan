<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sathi Japan – Garbage days, visa and life in Japan, in Nepali and English</title>
<meta name="description" content="Garbage days for your town, visa renewal reminders and step-by-step checklists for life in Japan – in Nepali and English. Free.">
<meta name="theme-color" content="#0B2E6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F6FA; --surface:#FFFFFF; --ink:#0B2E6B; --text:#1B2333; --muted:#5B6B82;
    --line:#DCE2EC; --crimson:#C8102E; --soft:#E8EDF6;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0C1424; --surface:#131E33; --ink:#A9C4F5; --text:#E7ECF5; --muted:#93A2BA;
    --line:#26344D; --crimson:#FF5A6E; --soft:#1A2741;
  }}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--text);
    font:400 18px/1.55 "Mukta","Noto Sans Devanagari","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  a{color:var(--ink)}
  :focus-visible{outline:3px solid var(--crimson);outline-offset:3px;border-radius:6px}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}

  /* Top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
  .brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
  .brand b{font-weight:800;font-size:24px;letter-spacing:-.01em}
  .brand span{font-size:18px;color:var(--muted)}
  .lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 2px rgba(11,46,107,.15)}

  /* Hero = live answer */
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:end;padding:28px 0 44px}
  .when{font-size:20px;font-weight:500;color:var(--crimson);margin:0}
  h1{font-weight:800;color:var(--ink);font-size:clamp(40px,7.2vw,76px);line-height:1.02;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance}
  h1.long{font-size:clamp(32px,5.2vw,54px);line-height:1.08}
  .icons{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
  .icons span{font-size:40px;width:68px;height:68px;display:grid;place-items:center;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
  .lead{font-size:20px;color:var(--muted);margin:18px 0 0;max-width:34ch}
  .area{font-size:16px;color:var(--muted);margin:22px 0 0}
  .area strong{color:var(--text);font-weight:500}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:17px;padding:12px 20px;border-radius:12px;text-decoration:none;cursor:pointer;border:0}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}

  /* Week strip */
  .week{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px}
  .week ol{list-style:none;margin:0;padding:0}
  .week li{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:14px}
  .week li+li{border-top:1px solid var(--line);border-radius:0}
  .week li.now{background:var(--soft);border-radius:14px;border-top-color:transparent}
  .week li.now+li{border-top-color:transparent}
  .week .d{font-size:15px;color:var(--muted);line-height:1.2}
  .week .d b{display:block;color:var(--text);font-size:17px}
  .week .c{font-size:16px;line-height:1.35}
  .week .c i{font-style:normal;margin-right:4px}
  .week .none{color:var(--muted)}

  /* Sections */
  section{padding:48px 0;border-top:1px solid var(--line)}
  h2{font-weight:800;color:var(--ink);font-size:clamp(28px,4vw,38px);line-height:1.1;letter-spacing:-.015em;margin:0 0 8px}
  .intro{color:var(--muted);margin:0 0 26px;max-width:58ch}

  /* Tools: rows, not cards */
  .tools{list-style:none;margin:0;padding:0}
  .tools li{border-top:1px solid var(--line)}
  .tools li:last-child{border-bottom:1px solid var(--line)}
  .tools a{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;padding:20px 4px;text-decoration:none;color:var(--text)}
  .tools a:hover .t{text-decoration:underline;text-underline-offset:4px}
  .tools .ic{font-size:34px;text-align:center}
  .tools .t{font-weight:700;font-size:22px;color:var(--ink);display:block;line-height:1.2}
  .tools .s{color:var(--muted);font-size:17px;display:block;margin-top:2px}
  .tools .go{font-weight:700;color:var(--ink);font-size:16px;white-space:nowrap}
  .tools .soon a{cursor:default}
  .tools .soon .t{color:var(--muted)}
  .tools .soon .go{color:var(--muted);font-weight:500}

  /* Garbage guide */
  .types{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 32px}
  details{border-top:1px solid var(--line);padding:12px 0}
  summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary .ic{font-size:26px;text-align:center}
  summary b{display:block;font-weight:700;line-height:1.25}
  summary small{display:block;color:var(--muted);font-size:15px}
  details p{margin:8px 0 4px 50px;color:var(--muted);font-size:16px}
  .bulky{margin-top:24px;padding:16px 18px;background:var(--soft);border-radius:14px;font-size:16px}

  /* Promises */
  .promises{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .promises h3{margin:0 0 6px;font-size:20px;color:var(--ink);font-weight:700}
  .promises p{margin:0;color:var(--muted);font-size:17px}

  footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--muted);font-size:15px}
  footer p{margin:0 0 8px;max-width:70ch}

  @media (max-width:420px){.brand span{display:none}.lang button{padding:6px 11px}}
  @media (max-width:820px){
    .hero{grid-template-columns:1fr;gap:28px;padding-top:12px}
    .promises{grid-template-columns:1fr;gap:20px}
    .tools a{grid-template-columns:44px 1fr;gap:14px}
    .tools .go{display:none}
    .icons span{width:58px;height:58px;font-size:34px}
  }
  @media (prefers-reduced-motion:no-preference){
    .hero .live{animation:in .5s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }

  /* Area picker */
  .area button.link{border:0;background:none;padding:0;font:inherit;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-left:6px}
  .sheet{position:fixed;inset:0;background:rgba(8,20,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet[hidden]{display:none}
  .panel{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 20px 28px}
  @media (min-width:700px){.sheet{align-items:center}.panel{border-radius:22px}}
  .panel h2{font-size:26px;margin:0 0 4px}
  .panel .close{float:right;border:0;background:var(--soft);color:var(--ink);font:inherit;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer}
  .cities{display:grid;gap:8px;margin:16px 0}
  .cities button{display:block;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer}
  .cities button b{display:block;color:var(--ink);font-size:18px}
  .cities button span{font-size:15px;color:var(--muted)}
  .cities button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
  .search{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text)}
  .towns{list-style:none;margin:10px 0 0;padding:0}
  .towns button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--text);font:inherit;padding:10px 4px;cursor:pointer}
  .towns button b{font-weight:700;color:var(--ink)}
  .towns button small{display:block;color:var(--muted);font-size:14px}
  .towns .empty{color:var(--muted);padding:10px 4px}
  .links{list-style:none;padding:0;margin:12px 0 0}
  .links a{display:block;padding:10px 4px;border-top:1px solid var(--line);font-weight:700;text-decoration:none}
  .hint{font-size:15px;color:var(--muted);margin:8px 0 0}
</style>
</head>

      <p class="intro" id="garbP"></p>
      <div class="types" id="types"></div>
      <div class="bulky" id="bulky"></div>
    </section>

    <section id="promises">
      <h2 data-t="promH"></h2>
      <div class="promises">
        <div><h3 data-t="p1h"></h3><p data-t="p1"></p></div>
        <div><h3 data-t="p2h"></h3><p data-t="p2"></p></div>
        <div><h3 data-t="p3h"></h3><p data-t="p3"></p></div>
      </div>
    </section>
  </main>

  <footer>
    <p data-t="foot1"></p>
    <p id="srcLine"></p>
  </footer>
</div>

<!-- Area picker -->
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="pickTitle">

</div>

 src:"फोहोर डाटा:",official:"आधिकारिक तालिका",checked:"अन्तिम जाँच",
 days:["आइत","सोम","मंगल","बुध","बिही","शुक्र","शनि"],months:["जनवरी","फेब्रुअरी","मार्च","अप्रिल","मे","जुन","जुलाई","अगस्ट","सेप्टेम्बर","अक्टोबर","नोभेम्बर","डिसेम्बर"]
}};
const A=window.SATHI_AREAS;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lang")||"en";
// Saved area: {c: city id, t: town index}. Earlier testers (Oodori) keep working.
let sel=null;try{sel=JSON.parse(store.get("area")||"null")}catch(e){}
let pickCity=sel?sel.c:null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const city=()=>sel&&A.cities.find(c=>c.id===sel.c);
const town=()=>{const c=city();return c&&c.towns[sel.t]};
const cat=id=>city().categories.find(c=>c.id===id);

// Dates in Japan time
function jpNow(){return new Date(Date.now()+9*3600e3)}
function iso(off){const d=jpNow();d.setUTCDate(d.getUTCDate()+off);return d.toISOString().slice(0,10)}
function idsFor(k){
  const c=city(),t=town(); if(!c||!t||t.special) return null;
  if(k>c.validUntil) return null;
  if(c.type==="dated") return c.schedule[k]||[];
  const d=new Date(k+"T00:00:00Z"),wd=d.getUTCDay(),md=k.slice(5);
  if(c.noCollection.includes(md)) return [];
  const out=[];
  if(t.res.includes(wd)) out.push("res");
  if(t.burn.includes(wd)) out.push("burn");
  if(t.metal.wd===wd&&t.metal.nth.includes(Math.ceil(d.getUTCDate()/7))) out.push("metal");
  return out;
}
function names(ids){return ids.map(i=>cat(i)[lang]).join(lang==="ne"?" र ":" and ")}
function dayList(ws){const t=T[lang];return ws.map(w=>t.days[w]).join(t.and)}
function ruleText(cg){
  const c=city(),t=T[lang];
  if(c.type==="dated") return cg.rule_text[lang];
  const tw=town(); if(cg.id==="metal") return `${tw.metal.nth.map(n=>t.nth[n]).join(t.and)} ${t.days[tw.metal.wd]} ${t.ofMonth}`;
  return `${t.every} ${dayList(cg.id==="res"?tw.res:tw.burn)}`;
}
function townLabel(c,tw){return lang==="ne"?`${tw.ro} (${tw.ja})`:`${tw.ro} (${tw.ja})`}

function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const c=city(),tw=town();
  let when="",head="",lead="",ids=[],actions="";
  if(!c||!tw){
    when=t.welcome;head=t.hChoose;lead=t.lChoose;
    actions=`<button class="btn primary" id="openPick">${t.choose}</button>`;
    $("areaLine").innerHTML="";
  }else{
    $("areaLine").innerHTML=`<span>${t.areaLabel}</span> <strong>${esc(tw.ro)}, ${esc(c.name[lang])}</strong><button class="link" id="openPick2">${t.change}</button>`;
    if(tw.special){
      const o=c.offices[tw.office];
      when=t.welcome;head=t.hSpecial;lead=t.lSpecial(lang==="ne"?o.ja:o.en,o.tel);
      actions=`<a class="btn primary" href="tel:${o.tel.replace(/-/g,"")}">${t.call} ${o.tel}</a>`;
    }else{
      const hour=jpNow().getUTCHours(),today=idsFor(iso(0)),tmr=idsFor(iso(1));
      if(hour<8&&today&&today.length){when=t.morning;ids=today;head=names(ids);lead=t.lMorning}
      else if(tmr&&tmr.length){when=t.tomorrow;ids=tmr;head=names(ids);lead=t.lTomorrow}
      else{
        when=t.tomorrow;head=t.hNone;let k=2,nx=null;while(k<20&&!((nx=idsFor(iso(k)))&&nx.length))k++;
        const d=new Date(iso(k)+"T00:00:00Z");
        lead=nx&&nx.length?t.lNone(`${t.days[d.getUTCDay()]} ${d.getUTCDate()} ${t.months[d.getUTCMonth()]}`,names(nx)):"";
      }
      actions=`<button class="btn primary" id="ics">${t.addCal}</button><a class="btn quiet" href="#garbage">${t.howTo}</a>`;
    }
  }
  $("when").textContent=when;$("headline").textContent=head;$("lead").textContent=lead;
  $("headline").classList.toggle("long",ids.length>1||head.length>34);
  $("icons").innerHTML=ids.map(i=>`<span>${cat(i).icon}</span>`).join("");
  $("actions").innerHTML=actions;
  ["openPick","openPick2"].forEach(id=>{const b=$(id);if(b)b.onclick=openPicker});
  if($("ics")) $("ics").onclick=downloadIcs;

  // Week strip
  const showWeek=c&&tw&&!tw.special;
  $("weekBox").hidden=!showWeek;
  if(showWeek){
    let w="";
    for(let i=0;i<7;i++){
      const k=iso(i),d=new Date(k+"T00:00:00Z"),x=idsFor(k);
      const label=i===0?t.today:i===1?t.tmr:t.days[d.getUTCDay()];
      w+=`<li class="${i===0?"now":""}"><span class="d"><b>${label}</b>${d.getUTCDate()} ${t.months[d.getUTCMonth()]}</span><span class="c">${x&&x.length?x.map(id=>`<i aria-hidden="true">${cat(id).icon}</i>${cat(id)[lang]}`).join("<br>"):`<span class="none">${t.none}</span>`}</span></li>`;
    }
    $("week").innerHTML=w;
  }

  // Garbage guide
  if(showWeek){
    $("garbP").textContent=t.garbP;
    $("types").innerHTML=c.categories.map(cg=>`<details><summary><span class="ic" aria-hidden="true">${cg.icon}</span><span><b>${cg[lang]}</b><small>${ruleText(cg)}</small></span></summary><p>${cg.how[lang]}<br>${cg.ja}</p></details>`).join("");
    let b=`${c.bulky[lang]} <a href="${c.bulky.url}" target="_blank" rel="noopener">${t.book}</a>`;
    if(c.noCollection) b+=`<br>${t.noJan3}`;
    if(c.guideNe) b+=`<br><a href="${c.guideNe}" target="_blank" rel="noopener">${t.guideNe}</a> · <a href="${c.guideEn}" target="_blank" rel="noopener">${t.guideEn}</a>`;
    $("bulky").innerHTML=b;$("bulky").hidden=false;
    $("srcLine").innerHTML=`${t.src} <a href="${c.source}" target="_blank" rel="noopener">${esc(c.name[lang])} ${t.official}</a>. ${t.checked} ${c.lastChecked}.`;
  }else{
    $("garbP").textContent=t.garbChoose;$("types").innerHTML="";$("bulky").hidden=true;$("srcLine").innerHTML="";
  }
  if(!$("sheet").hidden) renderPicker();
}

// ---------- Picker ----------
let query="";
function norm(s){return s.toLowerCase().normalize("NFKC").replace(/[^a-z0-9\u3040-\u30ff\u4e00-\u9fff]/g,"").replace(/ou/g,"o").replace(/oo/g,"o").replace(/uu/g,"u")}
function openPicker(){$("sheet").hidden=false;renderPicker();setTimeout(()=>{const s=$("q");if(s)s.focus()},50)}
function closePicker(){$("sheet").hidden=true}
function renderPicker(){
  const t=T[lang];
  const opts=A.cities.map(c=>`<button data-c="${c.id}" aria-pressed="${pickCity===c.id}"><b>${esc(c.name[lang])}</b><span>${esc(c.coverage[lang])}</span></button>`).join("")
    +`<button data-c="other" aria-pressed="${pickCity==="other"}"><b>${t.otherH}</b><span>${t.otherS}</span></button>`;
  $("cities").innerHTML=opts;
  $("cities").querySelectorAll("button").forEach(b=>b.onclick=()=>{pickCity=b.dataset.c;query="";renderPicker();const s=$("q");if(s)s.focus()});
  let body="";
  if(pickCity==="other"){
    body=`<p class="hint">${t.otherP}</p><ul class="links">${A.links.map(l=>`<li><a href="${l.url}" target="_blank" rel="noopener">${esc(l[lang])} ↗</a></li>`).join("")}</ul>`;
  }else if(pickCity){
    const c=A.cities.find(x=>x.id===pickCity);
    const q=norm(query);
    const list=c.towns.map((tw,i)=>({tw,i})).filter(({tw})=>!q||norm(tw.ro).includes(q)||norm(tw.ja).includes(q));
    body=`<input class="search" id="q" type="search" placeholder="${t.search}" value="${esc(query)}" autocomplete="off">
      <ul class="towns">${list.length?list.map(({tw,i})=>`<li><button data-i="${i}"><b>${esc(tw.ro)}</b> ${esc(tw.ja.replace(/（.*$/,""))}${tw.note?`<small>${esc(tw.note)}</small>`:""}</button></li>`).join(""):`<li class="empty">${t.noMatch}</li>`}</ul>`;
    if(c.otherAreasUrl) body+=`<p class="hint">${t.notCovered} <a href="${c.otherAreasUrl}" target="_blank" rel="noopener">${esc(c.name[lang])} ↗</a></p>`;
  }
  $("pickBody").innerHTML=body;
  const q=$("q");
  if(q){q.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;renderPicker();const n=$("q");n.focus();n.setSelectionRange(pos,pos)}}
  $("pickBody").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{
    sel={c:pickCity,t:+b.dataset.i};store.set("area",JSON.stringify(sel));closePicker();render();window.scrollTo({top:0,behavior:"smooth"});
  });
}
$("closePick").onclick=closePicker;
$("sheet").onclick=e=>{if(e.target.id==="sheet")closePicker()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closePicker()});

// ---------- Calendar file (made on the phone) ----------
function fold(line){const enc=new TextEncoder();let out=[],cur="",lim=75;for(const ch of line){if(enc.encode(cur+ch).length>lim){out.push(cur);cur=" "+ch;lim=75}else cur+=ch}out.push(cur);return out.join("\r\n")}

function downloadIcs(){
  const c=city(),tw=town(),t=T.en,stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const esc2=s=>s.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sathi Japan//Garbage//EN","CALSCALE:GREGORIAN",`X-WR-CALNAME:Sathi Japan – Garbage (${esc2(tw.ro)})`];
  for(let i=0;i<200;i++){
    const k=iso(i),x=idsFor(k);if(x===null)break;if(!x.length)continue;
    const ymd=k.replace(/-/g,""),nd=new Date(k+"T00:00:00Z");nd.setUTCDate(nd.getUTCDate()+1);
    const sum=x.map(id=>`${cat(id).icon} ${cat(id).en}`).join(" + ")+" / "+x.map(id=>cat(id).ne).join(" + ");
    L.push("BEGIN:VEVENT",`UID:${c.id}-${sel.t}-${ymd}@sathijapan.com`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ymd}`,
      `DTEND;VALUE=DATE:${nd.toISOString().slice(0,10).replace(/-/g,"")}`,`SUMMARY:${esc2(sum)}`,
      `DESCRIPTION:${esc2("Put out by 8:00 / बिहान ८:०० भित्र. Source: "+c.source)}`,"TRANSP:TRANSPARENT",
      "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-PT4H",`DESCRIPTION:${esc2("Tomorrow: "+sum)}`,"END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.map(fold).join("\r\n")+"\r\n"],{type:"text/calendar"}));
  a.download=`sathi-garbage-${c.id}.ics`;document.body.appendChild(a);a.click();a.remove();
}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lang",lang);render()});
render();
</script>
</body>
</html>
