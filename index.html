<style>
/* Sathi Japan landing.
   Layout: left-aligned headline beside one "explained form" sheet (the memorable element),
   then a plain list of tools, then three promises. Colours from the Nepal flag: crimson + navy. */
:root{
  --paper:#F5F7FB; --sheet:#FFFFFF; --ink:#0E1A33; --muted:#56637C; --line:#DCE2EE;
  --navy:#0B2E6B; --crimson:#C8102E; --tint:#E9EEF8;
  --f:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B1222; --sheet:#121C31; --ink:#E8EDF7; --muted:#9AA7BE; --line:#26334C;
  --navy:#A9C4F5; --crimson:#FF5A6E; --tint:#17233D; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.6 var(--f)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
:focus-visible{outline:3px solid var(--crimson);outline-offset:3px;border-radius:6px}

/* Top bar */
.top{display:flex;align-items:center;gap:16px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand svg{width:26px;height:30px;flex:none}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--navy)}
.brand span{font-size:16px;color:var(--muted);font-weight:500}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sheet)}
.lang button{border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:5px 13px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--navy);color:var(--sheet)}

/* Hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding-block:40px 56px}
.hero h1{font-size:clamp(36px,5.4vw,60px);line-height:1.04;font-weight:800;letter-spacing:-.025em;margin:0;color:var(--ink);text-wrap:balance;max-width:14ch}
:lang(ne) .hero h1{line-height:1.22;letter-spacing:0;max-width:16ch}
.hero p.lead{font-size:20px;color:var(--muted);margin:20px 0 0;max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:12px;font:inherit;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer;border:0}
.btn.main{background:var(--navy);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--navy)}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:26px 0 0;padding:0;list-style:none;font-size:16px;color:var(--muted)}
.facts li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--crimson);margin-right:8px;vertical-align:2px}

/* The explained form */
.formwrap{position:relative}
.sheetdoc{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:26px 26px 22px;box-shadow:0 1px 0 var(--line),0 24px 48px -28px rgba(11,46,107,.35);position:relative}
.sheetdoc::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--navy);border-radius:6px 6px 0 0}
.docjp{padding-right:84px;font-family:var(--jp);font-weight:700;font-size:clamp(22px,2.6vw,28px);letter-spacing:.02em;margin:6px 0 2px;color:var(--ink);line-height:1.35}
.docro{font-size:14px;color:var(--muted);margin:0 0 16px;padding-right:84px}
.field{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:11px 0;border-top:1px dashed var(--line);font-size:17px}
.field dt{color:var(--muted);font-size:15px}
.field dd{margin:0;font-weight:500}
.stamp{position:absolute;right:20px;top:18px;width:74px;height:74px;border:3px solid var(--crimson);border-radius:50%;color:var(--crimson);display:grid;place-items:center;transform:rotate(-12deg);font-weight:800;font-size:19px;line-height:1;opacity:.92;text-align:center}
.stamp small{display:block;font-size:10px;font-weight:600;margin-top:3px;font-family:var(--jp)}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.picker button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.picker button[aria-pressed=true]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);color:var(--navy);font-weight:700}
.sheetdoc.swap{animation:swap .28s ease-out}
@keyframes swap{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheetdoc.swap{animation:none}}

/* Personal reminders (only when the person has saved something) */
.mine{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:8px 0 0}
.mine a{display:block;text-decoration:none;background:var(--tint);border-radius:12px;padding:14px 16px}
.mine .k{font-size:14px;color:var(--muted);display:block}
.mine .v{font-size:19px;font-weight:700;color:var(--navy)}

/* Sections */
section{padding-block:44px;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3vw,34px);line-height:1.15;letter-spacing:-.015em;margin:0 0 6px;font-weight:800}
section > p.sub{color:var(--muted);margin:0 0 26px;max-width:40em}

/* Tools */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;list-style:none;margin:0;padding:0}
.tools li{border-bottom:1px solid var(--line)}
.tools a,.tools .off{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:start;padding:20px 0;text-decoration:none}
.tools svg{width:40px;height:40px;stroke:var(--navy);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tools .t{display:block;font-size:21px;font-weight:700;line-height:1.25;color:var(--ink)}
.tools .s{display:block;color:var(--muted);font-size:16px;margin-top:3px}
.tools .where{display:block;font-size:14px;color:var(--navy);margin-top:6px;font-weight:600}
.tools .tag{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;margin-top:4px}
.tools .tag.live{background:var(--tint);color:var(--navy)}
.tools .tag.soon{border:1px solid var(--line);color:var(--muted)}
.tools a:hover .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.tools .off{opacity:.7}

/* Promises */
.prom{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.prom h3{font-size:19px;margin:0 0 6px;color:var(--ink)}
.prom p{margin:0;color:var(--muted);font-size:16px}
.prom div{border-top:3px solid var(--crimson);padding-top:14px}

/* Help */
.help{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.help p{margin:0;max-width:40em}
.help b{display:block;font-size:20px}
.tel{font-size:26px;font-weight:800;color:var(--navy);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}

footer{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--muted);font-size:15px}
footer p{margin:0 0 6px;max-width:60em}
footer a{color:var(--navy)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:36px;padding-block:20px 40px}
  .tools{grid-template-columns:1fr}
  .prom{grid-template-columns:1fr;gap:22px}
}
@media (max-width:420px){
  .wrap{padding-inline:16px}
  .brand span{display:none}
  .field{grid-template-columns:1fr;gap:2px}
  .stamp{width:62px;height:62px;font-size:16px;right:14px}
  .docjp,.docro{padding-right:66px}
  .sheetdoc{padding:24px 18px 18px}
}
</style>
</head>

 helpH:"भिसाबारे प्रश्न छ?",helpP:"इमिग्रेसन सूचना केन्द्रले नेपाली, अंग्रेजी र अन्य भाषामा जवाफ दिन्छ, कार्यदिन ८:३०–१७:१५।",

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lang")||"en", docI=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderDoc(anim){
  const d=T[lang].docs[docI];
  $("docjp").textContent=d.jp; $("docjp").lang="ja"; $("docro").textContent=d.ro;
  $("docfields").innerHTML=d.f.map(f=>`<div class="field"><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join("");
  $("picker").innerHTML=T[lang].docs.map((x,i)=>`<button data-i="${i}" aria-pressed="${i===docI}">${esc(x.tab)}</button>`).join("");
  $("picker").querySelectorAll("button").forEach(b=>b.onclick=()=>{docI=+b.dataset.i;renderDoc(true)});
  if(anim){const el=$("doc");el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap")}
}
function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("facts").innerHTML=t.facts.map(f=>`<li>${esc(f)}</li>`).join("");
  $("toolList").innerHTML=t.tools.map(x=>{
    const inner=`${ICON[x.i]}<span><span class="t">${esc(x.t)}</span><span class="s">${esc(x.s)}</span>${x.w?`<span class="where">${esc(x.w)}</span>`:""}</span><span class="tag ${x.live?"live":"soon"}">${x.live?t.live:t.soon}</span>`;
    return `<li>${x.live?`<a href="${x.href}">${inner}</a>`:`<div class="off">${inner}</div>`}</li>`}).join("");
  $("prom").innerHTML=t.prom.map(p=>`<div><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p></div>`).join("");
  renderDoc(false); renderMine();
}

// Personal strip: only from what this phone already saved (garbage area, visa expiry)
const jpISO=o=>{const d=new Date(Date.now()+9*3600e3);d.setUTCDate(d.getUTCDate()+o);return d.toISOString().slice(0,10)};
const SHIFT=["nonburnable","pet","paper","glass","cans","special5"];
const hit=(r,wd,dd)=>r.c.some(cl=>cl.d.includes(wd)&&(!cl.n||cl.n.includes(Math.ceil(dd/7))));
function ids(c,tw,k){
  if(!c||!tw||tw.special||k>c.validUntil) return null;
  const dt=new Date(k+"T00:00:00Z"),m=dt.getUTCMonth()+1,d=dt.getUTCDate(),wd=dt.getUTCDay();
  if(c.type==="dated") return c.schedule[k]||[];
  if(c.type==="cal"){const cal=c.calendars[tw.cal];
    if(m===1&&d<=3) return []; if(m===12&&d===31) return ["burnable"];
    let sh=false; if(cal.jan&&m===1) for(let x=1;x<=3;x++){const w=new Date(Date.UTC(dt.getUTCFullYear(),0,x)).getUTCDay();if(SHIFT.some(id=>cal.r[id]&&hit(cal.r[id],w,x)))sh=true}
    return c.categories.filter(cg=>{const r=cal.r[cg.id];if(!r||(r.off&&r.off.includes(m)))return false;let dd=d;if(sh&&SHIFT.includes(cg.id)){dd=d-7;if(dd<1)return false}return hit(r,wd,dd)}).map(cg=>cg.id)}
  if(c.noCollection.includes(k.slice(5))) return [];
  const o=[]; if(tw.res.includes(wd))o.push("res"); if(tw.burn.includes(wd))o.push("burn");
  if(tw.metal.wd===wd&&tw.metal.nth.includes(Math.ceil(d/7)))o.push("metal"); return o;
}
let areasLoaded=false;
function renderMine(){
  const t=T[lang], out=[];
  let sel=null;try{sel=JSON.parse(store.get("area")||"null")}catch(e){}
  if(sel&&window.SATHI_AREAS){
    const A=window.SATHI_AREAS;let c=A.cities.find(x=>x.id===sel.c),ti=sel.t;
    if(!c){const nc=A.cities.find(x=>x.legacy&&x.legacy[sel.c]);if(nc){c=nc;ti=nc.legacy[sel.c][sel.t]}}
    const tw=c&&c.towns[ti];
    if(tw){const hr=new Date(Date.now()+9*3600e3).getUTCHours(),off=hr<8?0:1,x=ids(c,tw,jpISO(off));
      if(x){const name=(tw.ro||tw.ja).replace(/（.*$/,"");
        const v=x.length?x.map(id=>{const cg=c.categories.find(q=>q.id===id);return cg.icon+" "+cg[lang]}).join(", "):t.none;
        out.push(`<a href="garbage.html"><span class="k">${esc(t.mineGarb(name))} – ${off?t.tomorrow:t.today}</span><span class="v">${esc(v)}</span></a>`)}}
  }else if(sel&&!areasLoaded){areasLoaded=true;const s=document.createElement("script");s.src="areas.js";s.onload=renderMine;document.head.appendChild(s)}
  let dlist=[];try{dlist=JSON.parse(store.get("dl")||"[]")}catch(e){}
  const nx=dlist.filter(x=>!x.done&&x.d>=jpISO(0)).sort((a,b)=>a.d<b.d?-1:1)[0];
  if(nx){const days=Math.round((new Date(nx.d+"T00:00:00Z")-new Date(jpISO(0)+"T00:00:00Z"))/864e5);
    out.push(`<a href="deadlines.html"><span class="k">${esc(t.mineDl)}</span><span class="v">${esc((nx.k==="cu"&&nx.l)?nx.l:t.dlK[nx.k])} – ${esc(t.inDays(days))}</span></a>`)}
  const exp=store.get("visa_exp");
  if(exp){const days=Math.round((new Date(exp+"T00:00:00Z")-new Date(jpISO(0)+"T00:00:00Z"))/864e5);
    if(days>=0) out.push(`<a href="visa.html"><span class="k">${esc(t.mineVisa)}</span><span class="v">${esc(t.visaLeft(days,days<=92))}</span></a>`)}
  $("mine").innerHTML=out.join(""); $("mine").hidden=!out.length;
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lang",lang);render()});
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
