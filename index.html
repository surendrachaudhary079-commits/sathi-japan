<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sathi Japan – Garbage days, visa and life in Japan, in Nepali and English</title>
<meta name="description" content="Garbage days, visa renewal reminders and step-by-step checklists for life in Japan – in Nepali and English. Free.">
<meta name="theme-color" content="#0B2E6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F6FA; --surface:#FFFFFF; --ink:#0B2E6B; --text:#1B2333; --muted:#5B6B82;
    --line:#DCE2EC; --crimson:#C8102E; --soft:#E8EDF6;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0C1424; --surface:#131E33; --ink:#A9C4F5; --text:#E7ECF5; --muted:#93A2BA;
    --line:#26344D; --crimson:#FF5A6E; --soft:#1A2741;
  }}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--text);
    font:400 18px/1.55 "Mukta","Noto Sans Devanagari","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  a{color:var(--ink)}
  :focus-visible{outline:3px solid var(--crimson);outline-offset:3px;border-radius:6px}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}

  /* Top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
  .brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
  .brand b{font-weight:800;font-size:24px;letter-spacing:-.01em}
  .brand span{font-size:18px;color:var(--muted)}
  .lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 2px rgba(11,46,107,.15)}

  /* Hero = live answer */
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:end;padding:28px 0 44px}
  .when{font-size:20px;font-weight:500;color:var(--crimson);margin:0}
  h1{font-weight:800;color:var(--ink);font-size:clamp(40px,7.2vw,76px);line-height:1.02;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance}
  h1.long{font-size:clamp(32px,5.2vw,54px);line-height:1.08}
  .icons{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
  .icons span{font-size:40px;width:68px;height:68px;display:grid;place-items:center;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
  .lead{font-size:20px;color:var(--muted);margin:18px 0 0;max-width:34ch}
  .area{font-size:16px;color:var(--muted);margin:22px 0 0}
  .area strong{color:var(--text);font-weight:500}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:17px;padding:12px 20px;border-radius:12px;text-decoration:none;cursor:pointer;border:0}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}

  /* Week strip */
  .week{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px}
  .week ol{list-style:none;margin:0;padding:0}
  .week li{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:14px}
  .week li+li{border-top:1px solid var(--line);border-radius:0}
  .week li.now{background:var(--soft);border-radius:14px;border-top-color:transparent}
  .week li.now+li{border-top-color:transparent}
  .week .d{font-size:15px;color:var(--muted);line-height:1.2}
  .week .d b{display:block;color:var(--text);font-size:17px}
  .week .c{font-size:16px;line-height:1.35}
  .week .c i{font-style:normal;margin-right:4px}
  .week .none{color:var(--muted)}

  /* Sections */
  section{padding:48px 0;border-top:1px solid var(--line)}
  h2{font-weight:800;color:var(--ink);font-size:clamp(28px,4vw,38px);line-height:1.1;letter-spacing:-.015em;margin:0 0 8px}
  .intro{color:var(--muted);margin:0 0 26px;max-width:58ch}

  /* Tools: rows, not cards */
  .tools{list-style:none;margin:0;padding:0}
  .tools li{border-top:1px solid var(--line)}
  .tools li:last-child{border-bottom:1px solid var(--line)}
  .tools a{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;padding:20px 4px;text-decoration:none;color:var(--text)}
  .tools a:hover .t{text-decoration:underline;text-underline-offset:4px}
  .tools .ic{font-size:34px;text-align:center}
  .tools .t{font-weight:700;font-size:22px;color:var(--ink);display:block;line-height:1.2}
  .tools .s{color:var(--muted);font-size:17px;display:block;margin-top:2px}
  .tools .go{font-weight:700;color:var(--ink);font-size:16px;white-space:nowrap}
  .tools .soon a{cursor:default}
  .tools .soon .t{color:var(--muted)}
  .tools .soon .go{color:var(--muted);font-weight:500}

  /* Garbage guide */
  .types{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 32px}
  details{border-top:1px solid var(--line);padding:12px 0}
  summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary .ic{font-size:26px;text-align:center}
  summary b{display:block;font-weight:700;line-height:1.25}
  summary small{display:block;color:var(--muted);font-size:15px}
  details p{margin:8px 0 4px 50px;color:var(--muted);font-size:16px}
  .bulky{margin-top:24px;padding:16px 18px;background:var(--soft);border-radius:14px;font-size:16px}

  /* Promises */
  .promises{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .promises h3{margin:0 0 6px;font-size:20px;color:var(--ink);font-weight:700}
  .promises p{margin:0;color:var(--muted);font-size:17px}

  footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--muted);font-size:15px}
  footer p{margin:0 0 8px;max-width:70ch}

  @media (max-width:420px){.brand span{display:none}.lang button{padding:6px 11px}}
  @media (max-width:820px){
    .hero{grid-template-columns:1fr;gap:28px;padding-top:12px}
    .promises{grid-template-columns:1fr;gap:20px}
    .tools a{grid-template-columns:44px 1fr;gap:14px}
    .tools .go{display:none}
    .icons span{width:58px;height:58px;font-size:34px}
  }
  @media (prefers-reduced-motion:no-preference){
    .hero .live{animation:in .5s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>

function jpNow(){return new Date(Date.now()+9*3600e3)}

function names(ids){return ids.map(i=>cat(i)[lang]).join(lang==="ne"?" र ":" and ")}

  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("area").textContent=`${D.calendar[lang].replace(/ ?\(.*\)/,"")}, ${D.ward[lang]}, ${D.city[lang]}`;

  // Live hero: before 8:00 → today's collection; otherwise → tomorrow's
  const s=D.schedule, hour=jpNow().getUTCHours(), today=s[iso(0)], tmr=s[iso(1)];

  if(hour<8&&today){when=t.morning;ids=today;head=names(ids);lead=t.lMorning}
  else if(tmr){when=t.tomorrow;ids=tmr;head=names(ids);lead=t.lTomorrow}
  else{
    when=t.nothing;ids=[];head=t.hNone;
    let k=2,nx=null;while(k<15&&!(nx=s[iso(k)]))k++;
    const d=new Date(iso(k)+"T00:00:00Z");
    lead=nx?t.lNone(`${t.days[d.getUTCDay()]} ${d.getUTCDate()} ${t.months[d.getUTCMonth()]}`,names(nx)):"";

  // Week strip
  let w="";
  for(let i=0;i<7;i++){
    const k=iso(i),d=new Date(k+"T00:00:00Z"),x=s[k];

}
