function items(ids){
  if(!ids||!ids.length) return `<div class="none">${T[lang].none}</div>`;
  return ids.map(id=>{const c=cat(id);return `<div class="item"><span class="icon" style="background:${c.color}22">${c.icon}</span><span>${c[lang]}<br><span class="small">${c.ja}</span></span></div>`}).join("");
}
function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.getElementById("area").textContent=`${D.city[lang]} · ${D.ward[lang]} · ${D.calendar[lang]}`;
  const s=D.schedule, today=jpDate(0), tom=jpDate(1);
  document.getElementById("today").innerHTML=items(s[today]);
  document.getElementById("by").textContent=s[today]?t.by:"";
  document.getElementById("tomorrow").innerHTML=items(s[tom]);
  let w="";
  for(let i=2;i<9;i++){
    const k=jpDate(i), d=new Date(k+"T00:00:00Z");
    const ids=s[k];
    w+=`<li><span class="d">${t.days[d.getUTCDay()]} ${d.getUTCMonth()+1}/${d.getUTCDate()}</span><span>${ids?ids.map(id=>cat(id).icon+" "+cat(id)[lang]).join(", "):"—"}</span></li>`;
  }
  document.getElementById("week").innerHTML=w;
  document.getElementById("guide").innerHTML=D.categories.map(c=>
    `<details><summary><span class="icon" style="background:${c.color}22;width:32px;height:32px;font-size:20px">${c.icon}</span><span>${c[lang]}<br><span class="small" style="font-weight:400">${c.rule_text[lang]}</span></span></summary><p>${c.how[lang]}<br>${c.ja}</p></details>`).join("");
  document.getElementById("bulky").innerHTML=`${D.bulky[lang]} <a href="${D.bulky.url}" target="_blank" rel="noopener">↗</a>`;
  const src=document.getElementById("src"); src.href=D.sources[0].url; src.textContent=t.src;
  document.getElementById("checked").textContent=D.last_checked;
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}render()});
D=window.SATHI_DATA;render();
</script>
</body>
</html>
