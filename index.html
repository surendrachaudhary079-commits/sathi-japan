<!doctype html>

<title>Sathi Japan – Life in Japan, made easier | साथी जापान</title>
<meta name="description" content="Free help for Nepali people living in Japan, in English and Nepali: garbage calendar with reminders, visa renewal, city-office paperwork, healthcare and emergency numbers, banking, Japanese learning and daily life tips.">
<link rel="canonical" href="https://sathi-japan.vercel.app/">

<meta property="og:site_name" content="Sathi Japan">

<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--sx-paper);color:var(--sx-text);font:400 17px/1.6 var(--sx-f)}
a{color:var(--sx-green)}
:focus-visible{outline:3px solid var(--sx-blue);outline-offset:3px;border-radius:8px}
[lang=ja]{font-family:var(--sx-jp)}
[hidden]{display:none!important}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
section{margin-top:56px}
.eyebrow{display:inline-block;font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sx-teal)}
h2.h{font-size:clamp(26px,5vw,36px);line-height:1.15;margin:4px 0 8px;color:var(--sx-text);font-weight:800;letter-spacing:-.015em;text-wrap:balance}
p.sub{margin:0 0 22px;color:var(--sx-muted);max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16.5px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn .sx-ic{width:20px;height:20px}
.btn.pri{background:var(--sx-green);color:#fff}
.btn.pri:hover{background:#0B5948}
.btn.out{background:var(--sx-card);color:var(--sx-green);box-shadow:inset 0 0 0 2px var(--sx-line)}
@media (prefers-color-scheme:dark){.btn.pri{color:#0B1715}.btn.pri:hover{background:#A3E6CE}}

/* Personal strip */
.mine{display:flex;gap:10px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.mine::-webkit-scrollbar{display:none}
.mine a{flex:0 0 auto;display:flex;flex-direction:column;background:var(--sx-card);border:1px solid var(--sx-line);border-radius:14px;padding:8px 14px;text-decoration:none;color:var(--sx-text);box-shadow:var(--sx-shadow);min-width:180px}
.mine .k{font-size:13px;color:var(--sx-muted)}
.mine .v{font-weight:700;font-size:15.5px}

/* Hero */
.hero{margin-top:18px;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#D7EEF9 0%,#E7F6EF 62%,#F3F9F7 100%);border:1px solid var(--sx-line);display:grid;grid-template-columns:1fr;position:relative}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(180deg,#123049 0%,#123228 70%,#0B1715 100%)}}
.hero .txt{padding:28px 20px 6px;position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(34px,8.4vw,58px);line-height:1.04;letter-spacing:-.025em;font-weight:800;color:var(--sx-green);text-wrap:balance}
.hero .ne1{display:block;margin-top:8px;font-size:clamp(20px,4.6vw,28px);font-weight:700;color:var(--sx-teal);line-height:1.3}
.hero p.lead{margin:14px 0 0;font-size:18px;color:var(--sx-muted);max-width:44ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:18px 0 0;padding:0}
.pills li{display:inline-flex;align-items:center;gap:6px;background:var(--sx-card);border:1px solid var(--sx-line);border-radius:999px;padding:4px 12px;font-size:14.5px;font-weight:600;color:var(--sx-green)}
.pills .sx-ic{width:16px;height:16px}
.hero .art{display:block;width:100%;height:auto}
@media (min-width:880px){.hero{grid-template-columns:1.02fr 1fr;align-items:end;min-height:440px}.hero .txt{padding:52px 44px 48px}.hero .art{align-self:end}}

/* Services */
.svc{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:600px){.svc{grid-template-columns:1fr 1fr}}
@media (min-width:960px){.svc{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:22px;box-shadow:var(--sx-shadow)}
a.scard{display:flex;flex-direction:column;gap:10px;padding:20px;text-decoration:none;color:var(--sx-text);transition:transform .15s ease,box-shadow .15s ease;position:relative;overflow:hidden}
a.scard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(15,107,87,.08),0 14px 30px rgba(15,107,87,.12)}
@media (prefers-reduced-motion:reduce){a.scard{transition:none}a.scard:hover{transform:none}}
.badge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.badge .sx-ic{width:30px;height:30px}
.scard h3{margin:2px 0 0;font-size:20px;line-height:1.25;font-weight:800}
.scard h3 small{display:block;font-size:14.5px;font-weight:600;color:var(--sx-muted);margin-top:2px}
.scard p{margin:0;color:var(--sx-muted);font-size:15.5px}
.scard .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.scard .chips span{font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--sx-paper);border:1px solid var(--sx-line);color:var(--sx-muted)}
.scard .go{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--sx-green);font-size:15.5px}
.scard .go .sx-ic{width:18px;height:18px}
.bg-mint{background:var(--sx-mint)}.bg-aqua{background:var(--sx-aqua)}.bg-sky{background:var(--sx-sky)}.bg-butter{background:var(--sx-butter)}.bg-peach{background:var(--sx-peach)}.bg-lilac{background:var(--sx-lilac)}

/* Garbage band */
.gband{border-radius:28px;background:linear-gradient(135deg,#0F6B57 0%,#0E7C86 100%);color:#fff;padding:26px 20px;display:grid;gap:20px;overflow:hidden;position:relative}
@media (prefers-color-scheme:dark){.gband{background:linear-gradient(135deg,#0E3B33,#0D3A40)}}
@media (min-width:880px){.gband{grid-template-columns:1.1fr 1fr;padding:40px;align-items:center}}
.gband .eyebrow{color:#BDF0DE}
.gband h2{margin:4px 0 8px;font-size:clamp(26px,5vw,36px);line-height:1.15;font-weight:800}
.gband p{margin:0;color:#DDF5EC;max-width:46ch}
.gband ul.ticks{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.gband ul.ticks li{display:flex;gap:10px;align-items:flex-start}
.gband ul.ticks .sx-ic{width:22px;height:22px;flex:none;color:#FFE08A;margin-top:2px}
.gband .cta .btn.pri{background:#FFE08A;color:#14302A}
.gband .cta .btn.pri:hover{background:#FFD45C}
.gband .cta .btn.out{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.gprev{background:var(--sx-card);color:var(--sx-text);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.gprev .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.gprev .top .sx-ic{width:22px;height:22px;color:var(--sx-green)}
.gprev .top b{font-size:17px}
.gprev .top small{display:block;color:var(--sx-muted);font-size:13.5px}
.gday{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;border-top:1px solid var(--sx-line);padding:10px 0}
.gday .d b{display:block}.gday .d small{color:var(--sx-muted);font-size:13.5px}
.gday .c{font-weight:600}
.gday .c span{display:block;font-weight:500;font-size:13px;color:var(--sx-muted)}
.gday.hl{background:var(--sx-mint);border-radius:12px;padding:10px;border-top:0;margin:0 -10px}
.gnone{color:var(--sx-muted)}

/* New to Japan */
.newgrid{display:grid;gap:16px}
@media (min-width:880px){.newgrid{grid-template-columns:1.2fr 1fr}}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px;align-items:start}
ol.steps li:before{content:counter(s);width:44px;height:44px;border-radius:14px;background:var(--sx-mint);color:var(--sx-green);font-weight:800;font-size:20px;display:grid;place-items:center}
ol.steps b{display:block;font-size:17px;line-height:1.3}
ol.steps span{color:var(--sx-muted);font-size:15.5px}
.glinks{padding:18px;display:grid;gap:4px;align-content:start}
.glinks h3{margin:0 0 6px;font-size:18px}
.glinks a{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:14px;text-decoration:none;color:var(--sx-text)}
.glinks a:hover{background:var(--sx-mint)}
.glinks .sx-ic{width:22px;height:22px;flex:none;color:var(--sx-teal);margin-top:3px}
.glinks b{display:block;line-height:1.3}
.glinks small{display:block;color:var(--sx-muted);font-size:14px}
.ne-tag{display:inline-block;font-size:12px;font-weight:700;color:#7A3E00;background:#FFE7B3;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
@media (prefers-color-scheme:dark){.ne-tag{background:#4A3510;color:#FFE08A}}

/* Tools */
.tools{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:600px){.tools{grid-template-columns:1fr 1fr}}
@media (min-width:960px){.tools{grid-template-columns:repeat(4,1fr)}}
.tools a{display:flex;gap:12px;align-items:center;padding:14px;text-decoration:none;color:var(--sx-text)}
.tools a:hover{border-color:var(--sx-green-2)}
.tools .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--sx-mint);color:var(--sx-green)}
.tools .ti .sx-ic{width:24px;height:24px}
.tools b{display:block;line-height:1.25}
.tools small{display:block;color:var(--sx-muted);font-size:13.5px;line-height:1.35}

/* Community + trust */
.two{display:grid;gap:16px}
@media (min-width:880px){.two{grid-template-columns:1fr 1fr}}
.help{padding:20px;display:grid;gap:12px;align-content:start}
.help h3{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.help h3 .sx-ic{width:26px;height:26px;color:var(--sx-teal)}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border-top:1px solid var(--sx-line);padding-top:12px}
.line b{display:block;line-height:1.3}
.line small{display:block;color:var(--sx-muted);font-size:14px}
.line a.tel{font-weight:800;font-size:18px;text-decoration:none;white-space:nowrap;color:var(--sx-green)}
.line .src{grid-column:1/-1;font-size:13px}
.trust{display:grid;gap:12px}
.trust div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px}
.trust .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sx-sky);color:var(--sx-blue)}
.trust .ti .sx-ic{width:24px;height:24px}
.trust h3{margin:0;font-size:17px}
.trust p{margin:2px 0 0;color:var(--sx-muted);font-size:15.5px}
.sharebox{padding:20px;background:var(--sx-butter);border-color:color-mix(in srgb,var(--sx-yellow) 40%,var(--sx-line))}
.sharebox h3{margin:0 0 4px;font-size:20px}
.sharebox p{margin:0 0 12px;color:var(--sx-muted)}
</style>
</head>
<body>
<a class="sx-sr" href="#main">Skip to content</a>
<header id="sxHead"></header>

<main id="main" class="wrap">
  <div class="mine" id="mine" hidden aria-label="For you"></div>

  <!-- Hero -->
  <section class="hero" style="margin-top:14px" aria-labelledby="h1">
    <div class="txt">
      <span class="eyebrow" data-t="eyebrow"></span>
      <h1 id="h1"><span data-t="h1"></span><span class="ne1" data-t="h1b"></span></h1>

      <div class="cta">
        <a class="btn pri" href="#services"><span data-t="cta1"></span></a>

      <ul class="pills" id="pills"></ul>
    </div>
    <svg class="art" viewBox="0 0 560 330" role="img" id="heroArt">
      <defs><linearGradient id="riv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7CC6E8"/><stop offset="1" stop-color="#5DB3DC"/></linearGradient></defs>
      <circle cx="440" cy="70" r="30" fill="#E8505B" opacity=".9"/>
      <g fill="#fff" opacity=".85"><ellipse cx="120" cy="62" rx="34" ry="10"/><ellipse cx="150" cy="54" rx="24" ry="10"/><ellipse cx="330" cy="40" rx="28" ry="8"/></g>
      <path d="M190 210 L285 92 L380 210Z" fill="#8FB7D3"/>

      <!-- skyline -->
      <g fill="#6FA7C9"><rect x="70" y="140" width="26" height="80" rx="2"/><rect x="100" y="118" width="30" height="102" rx="2"/><rect x="134" y="150" width="22" height="70" rx="2"/><rect x="390" y="132" width="28" height="88" rx="2"/><rect x="422" y="150" width="22" height="70" rx="2"/></g>

      <g transform="translate(468 112)" fill="#C8553D"><path d="M-6 0h44l-8 10H2z"/><rect x="6" y="10" width="20" height="16"/><path d="M-8 26h48l-8 10H0z"/><rect x="5" y="36" width="22" height="18"/><path d="M-10 54h52l-8 10H-2z"/><rect x="4" y="64" width="24" height="44"/><path d="M15 -14v14" stroke="#C8553D" stroke-width="3"/></g>

  <!-- Services -->
  <section id="services" aria-labelledby="svcH">
    <span class="eyebrow" data-t="svcE"></span>
    <h2 class="h" id="svcH" data-t="svcH"></h2>
    <p class="sub" data-t="svcP"></p>
    <div class="svc" id="svc"></div>
  </section>

  <!-- Garbage reminder -->
  <section class="gband" aria-labelledby="gH">
    <div>
      <span class="eyebrow" data-t="gE"></span>
      <h2 id="gH" data-t="gH"></h2>
      <p data-t="gP"></p>
      <ul class="ticks" id="gTicks"></ul>
      <div class="cta"><a class="btn pri" id="gBtn" href="garbage.html"></a><a class="btn out" href="garbage.html" data-t="gHow" id="gHow"></a></div>
    </div>
    <div class="gprev" id="gPrev" aria-live="polite"></div>
  </section>

  <!-- New to Japan -->
  <section id="newcomer" aria-labelledby="nH">
    <span class="eyebrow" data-t="nE"></span>
    <h2 class="h" id="nH" data-t="nH"></h2>

      <ol class="steps" id="steps"></ol>
      <div class="card glinks" id="nLinks"></div>

    <span class="eyebrow" data-t="tE"></span>

        <div class="card sharebox"><h3 data-t="shH"></h3><p data-t="shP"></p><button class="btn pri" id="shareBtn" type="button"></button></div>
      </div>
    </div>
  </section>
</main>

<footer id="sxFoot"></footer>

// ---------- Garbage preview: uses the same data and rules as garbage.html / api/_lib.js ----------
function savedArea(){let s=null;try{s=JSON.parse(store.get("area")||"null")}catch(e){}return s&&typeof s.c==="string"&&Number.isInteger(s.t)?s:null}
function garbageHref(){const s=savedArea();return s?`garbage.html?area=${encodeURIComponent(s.c)}.${s.t}`:"garbage.html"}
const jpISO=o=>{const d=new Date(Date.now()+9*3600e3);d.setUTCDate(d.getUTCDate()+o);return d.toISOString().slice(0,10)};
const SHIFT=["nonburnable","pet","paper","glass","cans","special5"];
const hit=(r,wd,dd)=>r.c.some(cl=>cl.d.includes(wd)&&(!cl.n||cl.n.includes(Math.ceil(dd/7))));
function ids(c,tw,k){
  if(!c||!tw||tw.special||(c.validUntil&&k>c.validUntil)) return null;
  const dt=new Date(k+"T00:00:00Z"),m=dt.getUTCMonth()+1,d=dt.getUTCDate(),wd=dt.getUTCDay();
  if(c.type==="dated") return c.schedule[k]||[];
  if(c.type==="cal"){const cal=c.calendars[tw.cal];
    if(m===1&&d<=3) return []; if(m===12&&d===31) return ["burnable"];
    let sh=false; if(cal.jan&&m===1) for(let x=1;x<=3;x++){const w=new Date(Date.UTC(dt.getUTCFullYear(),0,x)).getUTCDay();if(SHIFT.some(id=>cal.r[id]&&hit(cal.r[id],w,x)))sh=true}
    return c.categories.filter(cg=>{const r=cal.r[cg.id];if(!r||(r.off&&r.off.includes(m)))return false;let dd=d;if(sh&&SHIFT.includes(cg.id)){dd=d-7;if(dd<1)return false}return hit(r,wd,dd)}).map(cg=>cg.id)}
  if(c.noCollection&&c.noCollection.includes(k.slice(5))) return [];
  const o=[]; if(tw.res.includes(wd))o.push("res"); if(tw.burn.includes(wd))o.push("burn");
  if(tw.metal.wd===wd&&tw.metal.nth.includes(Math.ceil(d/7)))o.push("metal"); return o;
}
let areasState="none";
function areaData(){
  const s=savedArea();if(!s)return null;
  if(!window.SATHI_AREAS){if(areasState==="none"){areasState="loading";const sc=document.createElement("script");sc.src="areas.js";sc.onload=()=>{areasState="ok";renderGarbage();renderMine()};sc.onerror=()=>{areasState="err"};document.head.appendChild(sc)}return "loading"}
  const A=window.SATHI_AREAS;let c=A.cities.find(x=>x.id===s.c),ti=s.t;
  if(!c){const nc=A.cities.find(x=>x.legacy&&x.legacy[s.c]);if(nc){c=nc;ti=nc.legacy[s.c][s.t]}}
  const tw=c&&c.towns[ti];return tw?{c,tw}:null;
}
function renderGarbage(){
  const t=T[lang],a=areaData();
  $("gBtn").textContent=a?t.gOpen:t.gChoose;$("gBtn").href=garbageHref();
  if(a==="loading"){$("gPrev").innerHTML=`<div class="top">${ic("cal")}<span><b>${esc(t.gYour)}</b></span></div>`;return}
  if(!a){$("gPrev").innerHTML=`<div class="top">${ic("pin")}<span><b>${esc(t.gYour)}</b><small>${esc(t.gPick)}</small></span></div><a class="btn pri" style="width:100%" href="garbage.html">${ic("pin")}${esc(t.gChoose)}</a>`;return}
  const {c,tw}=a,name=(tw.ro||tw.ja).replace(/（.*$/,"");
  let rows="",shown=0;
  for(let i=0;i<10&&shown<4;i++){const k=jpISO(i),x=ids(c,tw,k);if(x===null){rows+=`<p class="gnone">${esc(t.gNoData)}</p>`;break}
    if(i>1&&!x.length)continue;shown++;
    const d=new Date(k+"T00:00:00Z"),lbl=i===0?t.gToday:i===1?t.gTmr:t.days[d.getUTCDay()],dl=lang==="ne"?`${t.months[d.getUTCMonth()]} ${d.getUTCDate()}`:`${d.getUTCDate()} ${t.months[d.getUTCMonth()]}`;
    rows+=`<div class="gday${i===1?" hl":""}"><span class="d"><b>${esc(lbl)}</b><small>${esc(dl)}</small></span><span class="c">${x.length?x.map(id=>{const cg=c.categories.find(q=>q.id===id);return `${cg.icon} ${esc(cg[lang])}<span lang="ja">${esc(cg.ja)}</span>`}).join(""):`<span class="gnone" style="font-size:15px">${esc(t.gNone)}</span>`}</span></div>`}
  $("gPrev").innerHTML=`<div class="top">${ic("pin")}<span><b lang="ja">${esc(name)}</b><small>${esc(c.name[lang])}</small></span></div>${rows}`;
}

function renderMine(){
  const t=T[lang],out=[];
  let dlist=[];try{dlist=JSON.parse(store.get("dl")||"[]")}catch(e){}
  const nx=dlist.filter(x=>!x.done&&x.d>=jpISO(0)).sort((a,b)=>a.d<b.d?-1:1)[0];
  if(nx){const days=Math.round((new Date(nx.d+"T00:00:00Z")-new Date(jpISO(0)+"T00:00:00Z"))/864e5);
    out.push(`<a href="deadlines.html"><span class="k">${esc(t.mineDl)}</span><span class="v">${esc((nx.k==="cu"&&nx.l)?nx.l:t.dlK[nx.k]||"")} – ${esc(t.inDays(days))}</span></a>`)}
  const exp=store.get("visa_exp");
  if(exp&&/^\d{4}-\d{2}-\d{2}$/.test(exp)){const days=Math.round((new Date(exp+"T00:00:00Z")-new Date(jpISO(0)+"T00:00:00Z"))/864e5);
    if(days>=0) out.push(`<a href="visa.html"><span class="k">${esc(t.mineVisa)}</span><span class="v">${esc(t.visaLeft(days,days<=92))}</span></a>`)}
  $("mine").innerHTML=out.join("");$("mine").hidden=!out.length;
}
Sathi.onLang(render);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
