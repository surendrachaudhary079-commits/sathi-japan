<style>
/* My deadlines: one "next deadline" panel, a reminders bar, then a dated list like a wall calendar's margin. */
:root{--paper:#F3F9F7;--sheet:#FFFFFF;--ink:#0E1A33;--muted:#56637C;--line:#D3E6DE;--navy:#0F6B57;--crimson:#0E7C86;--tint:#E2F3EC;
  --hi:#C8102E;--mid:#A86200;--ok:#2A7D6F;--f:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;--jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0B1715;--sheet:#12221F;--ink:#E8EDF7;--muted:#9AA7BE;--line:#24392F;--navy:#7FD8B9;--crimson:#5CC8D0;--tint:#16302A;--hi:#FF6B7D;--mid:#F2B24C;--ok:#5BC9B5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.55 var(--f)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
:focus-visible{outline:3px solid var(--crimson);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding-block:16px}
.back{font-weight:800;font-size:19px;color:var(--navy);text-decoration:none;margin-right:auto}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sheet)}
.lang button{border:0;background:none;font-size:15px;padding:5px 13px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--navy);color:var(--sheet)}
h1{font-size:clamp(30px,7vw,40px);line-height:1.1;letter-spacing:-.02em;margin:8px 0 6px;font-weight:800}
.intro{color:var(--muted);margin:0 0 18px}
/* Next */
.next{background:var(--navy);color:var(--sheet);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end}
.next .k{grid-column:1/-1;font-size:15px;opacity:.85}
.next .name{font-size:24px;font-weight:800;line-height:1.2}
.next .date{font-size:16px;opacity:.9}
.next .left{font-size:44px;font-weight:800;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.next .left small{display:block;font-size:14px;font-weight:600;opacity:.85}
@media (prefers-color-scheme:dark){.next{background:#173A31;color:#F3F6FC}}
/* Reminders bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.bar .msg{flex:1 1 220px;font-size:16px}
.bar .msg b{display:block}
.bar select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;border:0;text-decoration:none;background:var(--navy);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--line)}
.btn.wide{width:100%;min-height:54px;font-size:18px}
.pstatus{font-size:15px;margin:-4px 0 10px;color:var(--muted)}
.pstatus:empty{display:none}
/* List */
h2{font-size:21px;margin:26px 0 8px}
.list{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.list li{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.cal{text-align:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;line-height:1.1}
.cal .m{display:block;background:var(--crimson);color:#fff;font-size:12px;font-weight:700;padding:2px 0}
.cal .d{display:block;font-size:22px;font-weight:800;padding:4px 0 3px;font-variant-numeric:tabular-nums}
.it .n{font-weight:700;line-height:1.3;display:block}
.it .s{font-size:14px;color:var(--muted);display:block}
.chip{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-block;margin-top:3px}
.chip.hi{background:var(--hi);color:#fff}.chip.mid{color:var(--mid);box-shadow:inset 0 0 0 1.5px var(--mid)}.chip.lo{color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.acts{display:flex;gap:6px}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:17px;display:grid;place-items:center}
.done .it .n{text-decoration:line-through;color:var(--muted)}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
details.donebox summary{cursor:pointer;color:var(--muted);margin:16px 0 8px;font-weight:600}
/* Add */
.groups{display:grid;gap:18px}
.group h3{font-size:16px;color:var(--muted);margin:0 0 8px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.tile:hover{border-color:var(--navy)}
.tile b{display:block;font-size:17px;line-height:1.3}
.tile span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
/* Sheet */
.sheet{position:fixed;inset:0;background:rgba(8,14,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.panel{background:var(--sheet);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:18px}}
.panel h2{margin:0 0 6px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:16px}
.row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row label{font-size:16px;display:flex;align-items:center;gap:8px}
.row input[type=checkbox]{width:20px;height:20px}
input[type=date],input[type=text],.panel select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.field{display:block;margin:12px 0 0;font-size:15px;color:var(--muted)}
.field input,.field select{margin-top:4px}
.note{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:12px}
.note a{color:var(--navy)}
.small{font-size:14px;color:var(--muted)}
.panel .btns{display:flex;gap:10px;margin-top:16px}
.panel .btns .btn{flex:1}
footer{margin-top:28px;font-size:14px;color:var(--muted)}
footer a{color:var(--navy)}
[hidden]{display:none!important}
</style>

  pp:"पासपोर्टमा लेखिएको म्याद। धेरै देश र एयरलाइनलाई कम्तीमा ६ महिना बाँकी चाहिन्छ, र टोकियोस्थित नेपाली दूतावासमा नवीकरणमा समय लाग्छ – त्यसैले ६ महिना अघि सम्झाउँछौं।",
  dl:"लाइसेन्समा लेखिएको मिति (いつまで有効)। जन्मदिनको १ महिना अघिदेखि नवीकरण गर्न सकिन्छ।",
  re:"みなし再入国 मा जापान छोड्दै हुनुहुन्छ? १ वर्षभित्र र रेसिडेन्स कार्डको म्याद सकिनुअघि फर्किनुपर्छ – नत्र स्टेटस सकिन्छ। फर्किन मिल्ने अन्तिम दिन राख्नुहोस्।",
  rt:"तलबबाट नकाटिई भुक्तानी पर्चीबाट आफैं नगर कर तिर्नुहुन्छ भने ४ किस्तामा तिरिन्छ। यी निगाता सिटीका मिति हुन्। अन्यत्र बस्नुहुन्छ भने पर्चीको मिति राख्नुहोस्।",
  nhi:"पर्चीबाट तिर्ने राष्ट्रिय स्वास्थ्य बीमा: जुलाईदेखि मार्चसम्म ९ किस्ता। यी निगाता सिटीका मिति हुन् – अरू सिटीमा फरक हुन्छ, पर्ची जाँच्नुहोस्।",
  pen:"राष्ट्रिय पेन्सन (कम्पनीको पेन्सनमा हुनुहुन्न भने): हरेक महिनाको भुक्तानी अर्को महिनाको अन्तिम दिनसम्म। आगामी १२ महिना थपिन्छ।",
  kei:"केई कार वा मोटरसाइकलको वार्षिक हल्का सवारी कर। यो निगाता सिटीको २०२६ को मिति हो।",
  cu:"अरू कुनै: चिठीको अन्तिम मिति, स्कूल फारम, घरभाडा नवीकरण। कार्ड, बैंक खाता वा My Number नम्बर नलेख्नुहोस्।"},
 date:"मिति",label:"के हो?",labelPh:"जस्तै घरभाडा नवीकरण",remind:"कहिले सम्झाउने",remOpt:{def:"सिफारिस गरिएको",w1:"१ हप्ता र १ दिन अघि",m1:"१ महिना, १ हप्ता र १ दिन अघि",d1:"१ दिन अघि मात्र"},
 save:"मेरो सूचीमा थप्नुहोस्",cancel:"रद्द गर्नुहोस्",close:"बन्द गर्नुहोस्",src:"आधिकारिक स्रोत",prefill:"भिसा गाइडको मितिबाट।",cityNote:"निगाता सिटीका मिति।",
 iosH:"iPhone: अर्को एक चरण",iosP:"iPhone ले Sathi Japan लाई Home Screen मा थपेपछि मात्र रिमाइन्डर पठाउँछ।",iosSteps:["Safari मा Share (□↑) थिच्नुहोस्।","“Add to Home Screen” अनि “Add” थिच्नुहोस्।","Home Screen बाट Sathi Japan खोलेर फेरि रिमाइन्डर सक्रिय गर्नुहोस्।"],
 foot:"तपाईंको सूची यो फोनमा सेभ हुन्छ। रिमाइन्डर सक्रिय गर्नुभयो भने, पठाउनका लागि मिति, प्रकार र तपाईंको छोटो नाम मात्र हाम्रो सर्भरमा सेभ हुन्छ – नाम वा नम्बर होइन। सामान्य जानकारी मात्र – सधैं आफ्नो कार्ड वा चिठीको मिति जाँच्नुहोस्।",
 privacy:"हामी के सेभ गर्छौं",icsCal:"Sathi अन्तिम मितिहरू"
}};
const MONTH={en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],ne:["जन","फेब","मार्च","अप्रि","मे","जुन","जुला","अग","सेप","अक्टो","नोभे","डिसे"]};

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lang")||"en";
let list=[];try{list=JSON.parse(store.get("dl")||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const dd=d=>Math.round((new Date(d+"T00:00:00Z")-new Date(today()+"T00:00:00Z"))/864e5);
const hourNow=()=>{const x=+(store.get("dl_hour")||store.get("remindHour")||20);return [6,7,18,19,20,21,22].includes(x)?x:20};
const save=()=>{store.set("dl",JSON.stringify(list));if(store.get("dl_remind")==="1")sync(false)};
const uid=()=>Math.random().toString(36).slice(2,10);
const fmtD=d=>{const x=new Date(d+"T00:00:00Z");return lang==="ne"?`${x.getUTCFullYear()}/${x.getUTCMonth()+1}/${x.getUTCDate()}`:x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})};
const name=it=>{const t=T[lang];return it.k==="cu"&&it.l?it.l:t.k[it.k][0]+(it.n?` · ${t.part(it.n)}`:"")};

// National pension: last day of the following month, moved to Monday if it falls on a weekend
function pensionDates(){const out=[],now=new Date(today()+"T00:00:00Z");
  for(let i=0;i<13;i++){const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+i+1,0));const w=d.getUTCDay();if(w===6)d.setUTCDate(d.getUTCDate()+2);if(w===0)d.setUTCDate(d.getUTCDate()+1);
    const s=d.toISOString().slice(0,10);if(s>=today())out.push(s)}return out.slice(0,12)}

function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const open=list.filter(x=>!x.done).sort((a,b)=>a.d<b.d?-1:1), upcoming=open.filter(x=>dd(x.d)>=0), past=open.filter(x=>dd(x.d)<0), done=list.filter(x=>x.done);
  // Next
  const n=upcoming[0];
  $("next").innerHTML=n?`<div class="next"><span class="k">${esc(t.next)}</span><div><div class="name">${esc(name(n))}</div><div class="date">${esc(fmtD(n.d))}</div></div><div class="left">${esc(t.days(dd(n.d)).replace(/ .*/,""))}<small>${dd(n.d)>1?esc(lang==="ne"?"दिन बाँकी":"days left"):""}</small></div></div>`
    :`<div class="empty"><b style="color:var(--ink)">${esc(t.nextNone)}</b><br>${esc(t.nextNoneP)}</div>`;
  // Bar
  const on=store.get("dl_remind")==="1";const hh=hourNow();
  const bm=on?t.barOn(hh+":00"):t.barOff;$("barMsg").innerHTML=`<b>${esc(bm[0])}</b>${esc(bm[1])}`;
  $("remind").textContent=on?t.off:t.on;
  $("hour").innerHTML=[18,19,20,21,22,6,7].map(h=>`<option value="${h}" ${h===hh?"selected":""}>${h}:00</option>`).join("");
  // Lists
  const row=it=>{const k=dd(it.d),x=new Date(it.d+"T00:00:00Z"),cls=it.done?"lo":k<0?"hi":k<=7?"hi":k<=30?"mid":"lo";
    const chip=it.done?"✓":k<0?t.overdue(-k):t.daysS(k);
    return `<li class="${it.done?"done":""}"><div class="cal" aria-hidden="true"><span class="m">${MONTH[lang][x.getUTCMonth()]}</span><span class="d">${x.getUTCDate()}</span></div>
     <div class="it"><span class="n">${KINDS[it.k].icon} ${esc(name(it))}</span><span class="s">${esc(fmtD(it.d))} · ${esc(t.remindsAt(it.b))}${it.k==="pen"&&!it.done&&pens.length>1?" · "+esc(t.more(pens.length-1)):""}</span><span class="chip ${cls}">${esc(chip)}</span></div>
     <div class="acts"><button class="icon" data-done="${it.id}" aria-label="${esc(it.done?t.undo:t.markDone)}" title="${esc(it.done?t.undo:t.markDone)}">${it.done?"↺":"✓"}</button><button class="icon" data-del="${it.id}" aria-label="${esc(t.del)}" title="${esc(t.del)}">🗑</button></div></li>`};
  // Monthly pension: show only the next date; the rest stay saved for reminders
  const pens=upcoming.filter(x=>x.k==="pen"), shown=upcoming.filter(x=>x.k!=="pen"||x===pens[0]);
  const soon=[...past,...shown.filter(x=>dd(x.d)<=60)], later=shown.filter(x=>dd(x.d)>60);
  let h="";
  if(!open.length&&!done.length) h=`<p class="empty">${esc(t.emptyList)}</p>`;
  if(soon.length) h+=`<h2>${esc(t.soon)}</h2><ul class="list">${soon.map(row).join("")}</ul>`;
  if(later.length) h+=`<h2>${esc(t.later)}</h2><ul class="list">${later.map(row).join("")}</ul>`;
  if(done.length) h+=`<details class="donebox"><summary>${esc(t.doneH(done.length))}</summary><ul class="list">${done.map(row).join("")}</ul></details>`;
  $("lists").innerHTML=h;
  $("lists").querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const it=list.find(x=>x.id===b.dataset.done);it.done=!it.done;save();render()});
  $("lists").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{list=list.filter(x=>x.id!==b.dataset.del);save();render()});
  // Add tiles
  $("groups").innerHTML=t.groups.map(g=>`<div class="group"><h3>${esc(g[0])}</h3><div class="tiles">${g[1].map(k=>`<button class="tile" data-k="${k}"><b>${KINDS[k].icon} ${esc(t.k[k][0])}</b><span lang="${/[\u3040-\u9fff]/.test(t.k[k][1])?"ja":lang}">${esc(t.k[k][1])}</span></button>`).join("")}</div></div>`).join("");
  $("groups").querySelectorAll(".tile").forEach(b=>b.onclick=()=>openAdd(b.dataset.k));
  $("iosSteps").innerHTML=t.iosSteps.map(s=>`<li>${esc(s)}</li>`).join("");
}

function openAdd(k){
  const t=T[lang],K=KINDS[k];let dates=[],srcUrl="",note="";
  if(k==="rt"||k==="nhi"||k==="kei"){dates=NIIGATA[k];srcUrl=k==="nhi"?SRC.niigataNhi:SRC.niigataTax;note=t.cityNote}
  if(k==="pen"){dates=pensionDates();srcUrl=SRC.pension}
  if(k==="rc"||k==="mn"){srcUrl=SRC.visa}
  if(k==="re"){srcUrl=SRC.reentry}
  const pre=(k==="rc"||k==="mn")?(store.get("visa_exp")||""):"";
  let body="";
  if(K.multi||k==="kei"){
    body=dates.map((d,i)=>{const past=d<today();return `<div class="row"><label><input type="checkbox" data-i="${i}" ${past?"disabled":"checked"}> ${esc(k==="kei"?t.k[k][0]:t.part(i+1))}</label><input type="date" data-d="${i}" value="${d}" ${past?"disabled":""}></div>`}).join("");
  }else{
    body=`${k==="cu"?`<label class="field">${esc(t.label)}<input type="text" id="aLabel" maxlength="40" placeholder="${esc(t.labelPh)}"></label>`:""}
      <label class="field">${esc(t.date)}<input type="date" id="aDate" value="${esc(pre)}" min="${today()}"></label>${pre?`<p class="small" style="margin:4px 0 0">${esc(t.prefill)}</p>`:""}`;
  }
  $("panel").innerHTML=`<h2 id="sheetH">${K.icon} ${esc(t.k[k][0])}</h2><p>${esc(t.info[k])}</p>${body}
    <label class="field">${esc(t.remind)}<select id="aRem">${Object.keys(REM).map(r=>`<option value="${r}">${esc(r==="def"?t.remOpt.def+" – "+t.remindsAt(K.b).replace(/^[^ ]+ /,""):t.remOpt[r])}</option>`).join("")}</select></label>
    ${srcUrl?`<div class="note">${note?esc(note)+" ":""}<a href="${srcUrl}" ${srcUrl.startsWith("http")?'target="_blank" rel="noopener"':""}>${esc(srcUrl.startsWith("http")?t.src+" ↗":t.visaGuide)}</a></div>`:""}
    <div class="btns"><button class="btn ghost" id="aCancel">${esc(t.cancel)}</button><button class="btn" id="aSave">${esc(t.save)}</button></div>`;
  $("sheet").hidden=false;
  $("aCancel").onclick=closeAdd;
  $("aSave").onclick=()=>{
    const b=REM[$("aRem").value]||K.b;let added=0;
    if(K.multi||k==="kei"){
      $("panel").querySelectorAll("input[type=checkbox]").forEach(c=>{if(!c.checked)return;const i=+c.dataset.i,d=$("panel").querySelector(`[data-d="${i}"]`).value;
        if(!d||d<today())return;list=list.filter(x=>!(x.k===k&&x.n===(k==="kei"?undefined:i+1)&&x.d===d));list.push({id:uid(),k,d,n:k==="kei"?undefined:(k==="pen"?undefined:i+1),b});added++});
    }else{
      const d=$("aDate").value;if(!d||d<today()){$("aDate").focus();return}
      const l=k==="cu"?($("aLabel").value||"").replace(/\d{6,}/g,"…").trim().slice(0,40):undefined;
      if(k!=="cu") list=list.filter(x=>!(x.k===k&&!x.done));   // one active date per card type
      list.push({id:uid(),k,d,l,b});added++;
    }
    if(added){save();closeAdd();render();window.scrollTo({top:0,behavior:"smooth"})}
  };
  setTimeout(()=>{const f=$("panel").querySelector("input:not([disabled]),select");if(f)f.focus()},50);
}
function closeAdd(){$("sheet").hidden=true}
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeAdd()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeAdd();$("iosSheet").hidden=true}});

// ---- Phone reminders (same notification permission as garbage reminders) ----
const pushOK="serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function keyBytes(b){const p="=".repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(s,c=>c.charCodeAt(0))}
const pst=k=>{$("pstatus").textContent=k?T[lang].p[k]:""};
async function getSub(create){
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub&&create){const {publicKey}=await (await fetch("/api/deadlines")).json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(publicKey)})}
  return sub;
}
async function sync(test){
  const sub=await getSub(false);if(!sub)return;
  const items=list.filter(x=>!x.done).map(x=>({k:x.k,d:x.d,n:x.n,l:x.l,b:x.b}));
  const r=await fetch("/api/deadlines",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sub:sub.toJSON(),lang,hour:hourNow(),items,test})});
  if(!r.ok){let j={};try{j=await r.json()}catch(_){}throw new Error((j.error||"server")+" "+(j.status||r.status))}
}
$("remind").onclick=async()=>{
  if(store.get("dl_remind")==="1"){
    try{const sub=await getSub(false);if(sub){await fetch("/api/deadlines",{method:"DELETE",headers:{"content-type":"application/json"},body:JSON.stringify({sub:sub.toJSON()})});if(store.get("remind")!=="1"&&store.get("fx_on")!=="1")await sub.unsubscribe()}}catch(e){console.error(e)}
    store.set("dl_remind","0");render();return pst("offd");
  }
  if(!list.some(x=>!x.done&&dd(x.d)>=0)) return pst("nothing");
  if(!pushOK){if(isIOS&&!standalone){$("iosSheet").hidden=false;return}return pst("no")}
  try{pst("wait");const perm=await Notification.requestPermission();if(perm!=="granted")return pst("blocked");
    await getSub(true);store.set("dl_remind","1");await sync(true);render();pst("ok");
  }catch(e){console.error(e);store.set("dl_remind","0");render();pst("err");$("pstatus").textContent+=` (${String(e.message||e).slice(0,60)})`}
};
$("hour").onchange=async e=>{store.set("dl_hour",e.target.value);render();if(store.get("dl_remind")==="1"){try{await sync(false);pst("upd")}catch(_){pst("err")}}};
$("iosClose").onclick=()=>{$("iosSheet").hidden=true};

// ---- Calendar file with alarms (works without notifications) ----
$("ics").onclick=()=>{
  const t=T[lang],items=list.filter(x=>!x.done&&dd(x.d)>=0);if(!items.length)return pst("nothing");
  const e=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sathi Japan//Deadlines//EN","CALSCALE:GREGORIAN",`X-WR-CALNAME:${e(t.icsCal)}`];
  for(const it of items){const d=it.d.replace(/-/g,""),n=new Date(it.d+"T00:00:00Z");n.setUTCDate(n.getUTCDate()+1);
    L.push("BEGIN:VEVENT",`UID:${it.id}@sathijapan.com`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${n.toISOString().slice(0,10).replace(/-/g,"")}`,`SUMMARY:${e(KINDS[it.k].icon+" "+name(it))}`);
    for(const b of it.b){const h=b*24-hourNow();L.push("BEGIN:VALARM","ACTION:DISPLAY",h>0?`TRIGGER:-PT${h}H`:`TRIGGER:PT${-h}H`,`DESCRIPTION:${e(name(it))}`,"END:VALARM")}   // alarm at the reminder hour, b days before
    L.push("END:VEVENT")}
  L.push("END:VCALENDAR");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")+"\r\n"],{type:"text/calendar"}));a.download="sathi-deadlines.ics";document.body.appendChild(a);a.click();a.remove();
};

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lang",lang);render();if(store.get("dl_remind")==="1")sync(false).catch(()=>{})});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
// Coming from the letter explainer: ?add=cu&d=YYYY-MM-DD&l=label
(()=>{const q=new URLSearchParams(location.search);const d=q.get("d");
  if(q.get("add")==="cu"&&/^\d{4}-\d{2}-\d{2}$/.test(d||"")&&d>=today()){
    const l=(q.get("l")||"").replace(/\d{6,}/g,"…").slice(0,40);
    if(!list.some(x=>x.k==="cu"&&x.d===d&&x.l===l)){list.push({id:uid(),k:"cu",d,l,b:[7,1]});save()}
    history.replaceState(null,"","deadlines.html")}})();
render();
</script>
<script src="site.js"></script>
