<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About, contact and help – Sathi Japan</title>
<meta name="description" content="About Sathi Japan, how to contact us, and answers to common questions about reminders, languages and privacy.">
<link rel="canonical" href="https://sathi-japan.vercel.app/about.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sathi Japan">
<meta property="og:title" content="About Sathi Japan">
<meta property="og:description" content="Life in Japan, explained in Nepali and English. Made in Niigata.">
<meta property="og:url" content="https://sathi-japan.vercel.app/about.html">
<meta property="og:image" content="https://sathi-japan.vercel.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0F6B57">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--sx-paper);color:var(--sx-text);font:400 17px/1.6 var(--sx-f)}
a{color:var(--sx-green)}
:focus-visible{outline:3px solid var(--sx-blue);outline-offset:3px;border-radius:8px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
h1{font-size:clamp(30px,6.5vw,44px);line-height:1.1;margin:26px 0 8px;color:var(--sx-green);font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;margin:0 0 8px;font-weight:800;display:flex;align-items:center;gap:10px}
h2 .sx-ic{width:28px;height:28px;color:var(--sx-teal)}
section{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:22px;box-shadow:var(--sx-shadow);padding:20px;margin-top:18px}
section p{margin:0 0 10px}
.muted{color:var(--sx-muted)}
ul.vals{margin:0;padding-left:20px}
ul.vals li{margin:0 0 6px}
details{border-top:1px solid var(--sx-line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;font-size:17px}
details p{margin:8px 0 0;color:var(--sx-muted)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;font-weight:700;text-decoration:none;background:var(--sx-green);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#0B1715}}
.btn .sx-ic{width:20px;height:20px}
.note{background:var(--sx-butter);border-radius:14px;padding:12px 14px;margin-top:10px}
</style>
</head>
<body>
<header id="sxHead"></header>
<main class="wrap" id="main">
  <h1 data-t="h1"></h1>
  <p class="muted" data-t="lead"></p>

  <section id="about" aria-labelledby="aH">
    <h2 id="aH"></h2>
    <p data-t="a1"></p>
    <p data-t="a2"></p>
    <ul class="vals" id="vals"></ul>
  </section>

  <section id="contact" aria-labelledby="cH">
    <h2 id="cH"></h2>
    <div id="contactBody"></div>
  </section>

  <section id="help" aria-labelledby="hH">
    <h2 id="hH"></h2>
    <div id="faq"></div>
  </section>
</main>
<footer id="sxFoot"></footer>
<script src="site.js"></script>
<script>
"use strict";
const T={
 en:{h1:"About Sathi Japan",lead:"Sathi (साथी) means “friend” in Nepali.",
  aH:"About us",a1:"Sathi Japan is a free website that explains life in Japan in simple English and Nepali – garbage days, visa paperwork, deadlines, healthcare and more.",
  a2:"It is made by a Nepali civil engineer living in Niigata, for Nepali workers, students and families across Japan.",
  vals:["Every rule links to its official source, with the date it was checked.","Your area, dates and ticks are saved on your own phone.","We never ask for your residence card number or My Number.","We explain – we do not fill in or submit applications for you, and we are not a government service."],
  cH:"Contact",cMail:"Email us",cNone:"Our contact email will be added here soon.",
  cNote:"We can't answer questions about your personal visa case. For that, call the Immigration information center (0570-013904, Nepali available) or ask a licensed administrative scrivener (行政書士).",
  hH:"Help",
  faq:[["Is Sathi Japan free?","Yes. There is no account and no sign-up."],
   ["How do garbage reminders work?","Open the garbage calendar, choose your town, and tap “Set reminder”. Your phone will get a notification at the time you choose – even when the website is closed."],
   ["I'm not getting reminders on my iPhone.","iPhone only allows website notifications after you add Sathi Japan to your Home Screen (Safari → Share □↑ → Add to Home Screen) and open it from there. iOS 16.4 or newer is needed."],
   ["I blocked notifications by mistake.","Android (Chrome): ⋮ → Settings → Site settings → Notifications → allow this site. iPhone: Settings → Notifications → Sathi → Allow."],
   ["My town is not in the list.","We cover all of Niigata City and Shinjuku so far. For other cities, the area picker links to your city's official garbage page."],
   ["How do I change the language?","Tap EN or नेपाली at the top of any page. Your choice is remembered on this phone."],
   ["Where is my data stored?","Lists and settings stay on your phone. Only if you turn on reminders do we save what is needed to send them. See the privacy policy."]],
  privacy:"Read the privacy policy"},
 ne:{h1:"Sathi Japan बारे",lead:"“साथी” भनेको नेपालीमा मित्र हो।",
  aH:"हाम्रोबारे",a1:"Sathi Japan एउटा निःशुल्क वेबसाइट हो जसले जापानको जीवन सजिलो नेपाली र अंग्रेजीमा बुझाउँछ – फोहोर फाल्ने दिन, भिसाका कागजी काम, अन्तिम मिति, स्वास्थ्य र अरू।",
  a2:"यो निगातामा बस्ने एक नेपाली सिभिल इन्जिनियरले जापानभरका नेपाली कामदार, विद्यार्थी र परिवारका लागि बनाएको हो।",
  vals:["हरेक नियममा आधिकारिक स्रोतको लिंक र जाँच मिति हुन्छ।","तपाईंको क्षेत्र, मिति र ठीक चिन्ह तपाईंकै फोनमा सेभ हुन्छ।","हामी रेसिडेन्स कार्ड नम्बर वा My Number कहिल्यै माग्दैनौं।","हामी बुझाउँछौं – आवेदन भर्दैनौं वा बुझाउँदैनौं, र हामी सरकारी सेवा होइनौं।"],
  cH:"सम्पर्क",cMail:"इमेल गर्नुहोस्",cNone:"हाम्रो सम्पर्क इमेल छिट्टै यहाँ थपिनेछ।",
  cNote:"तपाईंको व्यक्तिगत भिसा केसबारे हामी जवाफ दिन सक्दैनौं। त्यसका लागि इमिग्रेसन सूचना केन्द्र (0570-013904, नेपाली उपलब्ध) मा फोन गर्नुहोस् वा लाइसेन्स भएका 行政書士 लाई सोध्नुहोस्।",
  hH:"मद्दत",
  faq:[["Sathi Japan निःशुल्क हो?","हो। खाता वा दर्ता चाहिँदैन।"],
   ["फोहोर रिमाइन्डर कसरी काम गर्छ?","फोहोर क्यालेन्डर खोल्नुहोस्, टाउन छान्नुहोस्, र “रिमाइन्डर राख्नुहोस्” थिच्नुहोस्। वेबसाइट बन्द भए पनि तपाईंले छानेको समयमा फोनमा सूचना आउँछ।"],
   ["iPhone मा रिमाइन्डर आएन।","iPhone ले Sathi Japan लाई Home Screen मा थपेपछि (Safari → Share □↑ → Add to Home Screen) र त्यहाँबाट खोलेपछि मात्र सूचना दिन्छ। iOS 16.4 वा नयाँ चाहिन्छ।"],
   ["गल्तीले सूचना ब्लक गरें।","Android (Chrome): ⋮ → Settings → Site settings → Notifications → यो साइटलाई Allow। iPhone: Settings → Notifications → Sathi → Allow।"],
   ["मेरो टाउन सूचीमा छैन।","अहिलेसम्म सम्पूर्ण निगाता सिटी र सिन्जुकु समेटिएको छ। अरू सिटीका लागि क्षेत्र छनोटमा सिटीको आधिकारिक फोहोर पेजको लिंक छ।"],
   ["भाषा कसरी बदल्ने?","कुनै पनि पेजको माथि EN वा नेपाली थिच्नुहोस्। तपाईंको छनोट यो फोनमा सम्झिन्छ।"],
   ["मेरो डाटा कहाँ सेभ हुन्छ?","सूची र सेटिङ तपाईंकै फोनमा। रिमाइन्डर सक्रिय गर्नुभयो भने मात्र पठाउन चाहिने कुरा सेभ हुन्छ। गोपनीयता नीति हेर्नुहोस्।"]],
  privacy:"गोपनीयता नीति पढ्नुहोस्"}
};
const $=id=>document.getElementById(id),esc=Sathi.esc,ic=Sathi.icon;
Sathi.onLang(l=>{
  const t=T[l];document.title=(l==="ne"?"हाम्रोबारे, सम्पर्क र मद्दत":"About, contact and help")+" – Sathi Japan";
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
  $("aH").innerHTML=ic("people")+esc(t.aH);$("cH").innerHTML=ic("phone")+esc(t.cH);$("hH").innerHTML=ic("book")+esc(t.hH);
  $("vals").innerHTML=t.vals.map(v=>`<li>${esc(v)}</li>`).join("");
  const em=Sathi.contactEmail;
  $("contactBody").innerHTML=(em?`<p><a class="btn" href="mailto:${esc(em)}">${ic("share")}${esc(t.cMail)}: ${esc(em)}</a></p>`:`<p>${esc(t.cNone)}</p>`)+`<p class="note">${esc(t.cNote)}</p>`;
  $("faq").innerHTML=t.faq.map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("")+`<p style="margin-top:12px"><a href="privacy.html">${esc(t.privacy)} →</a></p>`;
});
if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),50)}
</script>
</body>
</html>
