<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guides for life in Japan – Sathi Japan</title>
<meta name="description" content="Official help for Nepali people in Japan, in English and Nepali: city office and paperwork, healthcare and emergency numbers, banking, Japanese learning and daily life tips.">
<link rel="canonical" href="https://sathi-japan.vercel.app/guides.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sathi Japan">
<meta property="og:title" content="Guides for life in Japan – Sathi Japan">
<meta property="og:description" content="Paperwork, healthcare, banking, Japanese and daily life – official links, explained in Nepali and English.">
<meta property="og:url" content="https://sathi-japan.vercel.app/guides.html">
<meta property="og:image" content="https://sathi-japan.vercel.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0F6B57">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--sx-paper);color:var(--sx-text);font:400 17px/1.6 var(--sx-f)}
a{color:var(--sx-green)}
:focus-visible{outline:3px solid var(--sx-blue);outline-offset:3px;border-radius:8px}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
h1{font-size:clamp(30px,6.5vw,46px);line-height:1.1;margin:26px 0 6px;color:var(--sx-green);font-weight:800;letter-spacing:-.02em}
.intro{color:var(--sx-muted);margin:0 0 14px;max-width:60ch}
.tabs{position:sticky;top:66px;z-index:20;background:color-mix(in srgb,var(--sx-paper) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:10px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--sx-line)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--sx-line);background:var(--sx-card);text-decoration:none;color:var(--sx-text);font-weight:600;font-size:15px}
.tabs a .sx-ic{width:18px;height:18px}
.tabs a[aria-current=true]{background:var(--sx-green);color:#fff;border-color:var(--sx-green)}
@media (prefers-color-scheme:dark){.tabs a[aria-current=true]{color:#0B1715}}
.topic{margin-top:34px}
.thead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.badge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.badge .sx-ic{width:30px;height:30px}
.thead h2{margin:0;font-size:clamp(23px,4.6vw,30px);line-height:1.15;font-weight:800}
.thead h2 small{display:block;font-size:15px;color:var(--sx-muted);font-weight:600}
.topic>p{margin:6px 0 14px;color:var(--sx-muted);max-width:62ch}
.items{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.items{grid-template-columns:1fr 1fr}}
@media (min-width:1020px){.items{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:20px;box-shadow:var(--sx-shadow);padding:16px;display:flex;flex-direction:column;gap:6px}
.item h3{margin:0;font-size:17.5px;line-height:1.3}
.item p{margin:0;color:var(--sx-muted);font-size:15.5px}
.item .src{font-size:13px;color:var(--sx-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .tool{font-size:12px;font-weight:700;color:var(--sx-green);background:var(--sx-mint);border-radius:6px;padding:0 6px}
.item .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:0;font-family:inherit}
.btn .sx-ic{width:18px;height:18px}
.btn.pri{background:var(--sx-green);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0B1715}}
.btn.out{background:var(--sx-card);color:var(--sx-green);box-shadow:inset 0 0 0 2px var(--sx-line)}
.btn.tel{background:var(--sx-butter);color:var(--sx-text);font-size:17px}
.ne-tag{display:inline-block;font-size:12px;font-weight:700;color:#7A3E00;background:#FFE7B3;border-radius:6px;padding:0 6px}
@media (prefers-color-scheme:dark){.ne-tag{background:#4A3510;color:#FFE08A}}
.sos{margin-top:18px;border-radius:20px;background:var(--sx-peach);padding:16px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.sos b{font-size:17px}
.sos a{font-size:24px;font-weight:800;text-decoration:none;color:#B4233A}
@media (prefers-color-scheme:dark){.sos a{color:#FF8A9A}}
.checked{margin-top:28px;font-size:14px;color:var(--sx-muted)}
.bg-mint{background:var(--sx-mint)}.bg-aqua{background:var(--sx-aqua)}.bg-sky{background:var(--sx-sky)}.bg-butter{background:var(--sx-butter)}.bg-peach{background:var(--sx-peach)}.bg-lilac{background:var(--sx-lilac)}
</style>
</head>
<body>
<header id="sxHead"></header>
<main class="wrap" id="main">
  <h1 data-t="h1"></h1>
  <p class="intro" data-t="intro"></p>
  <nav class="tabs" id="tabs" aria-label="Topics"></nav>
  <div class="sos" id="sos"></div>
  <div id="topics"></div>
  <p class="checked" data-t="checked"></p>
</main>
<footer id="sxFoot"></footer>
<script src="site.js"></script>
<script src="guides-data.js"></script>
<script>
"use strict";
const T={
 en:{h1:"Guides for life in Japan",intro:"Simple explanations with the official page for each topic. Look for the नेपाली tag – those pages are available in Nepali.",
  sos:"Emergency",fire:"Fire / ambulance",police:"Police",open:"Open",tool:"Sathi tool",call:"Call",nepali:"नेपाली",more:"More",from:"From",
  checked:"All official links were checked on 10 October 2026. Rules and phone hours can change – the official page is always the final word."},
 ne:{h1:"जापानको जीवनका लागि गाइड",intro:"हरेक विषयको सजिलो व्याख्या र आधिकारिक पेज। “नेपाली” चिन्ह भएका पेज नेपालीमा पनि उपलब्ध छन्।",
  sos:"आपतकाल",fire:"आगो / एम्बुलेन्स",police:"प्रहरी",open:"खोल्नुहोस्",tool:"Sathi सुविधा",call:"फोन",nepali:"नेपाली",more:"थप",from:"स्रोत",
  checked:"सबै आधिकारिक लिंक २०२६ अक्टोबर १० मा जाँचिएका हुन्। नियम र फोनको समय बदलिन सक्छ – आधिकारिक पेज नै अन्तिम हो।"}
};
const $=id=>document.getElementById(id),esc=Sathi.esc,ic=Sathi.icon,G=window.SATHI_GUIDES;
let lang="en";
function telHref(n){return "tel:"+n.replace(/-/g,"").replace("#","%23")}
function render(l){
  lang=l;const t=T[lang],other=lang==="ne"?"en":"ne";
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
  $("tabs").innerHTML=G.map(g=>`<a href="#${g.id}" data-id="${g.id}">${ic(g.icon)}${esc(g.title[lang])}</a>`).join("");
  $("sos").innerHTML=`<b>${esc(t.sos)}</b><span>${esc(t.fire)} <a href="tel:119">119</a></span><span>${esc(t.police)} <a href="tel:110">110</a></span>`;
  $("topics").innerHTML=G.map(g=>`<section class="topic" id="${g.id}" aria-labelledby="h-${g.id}">
    <div class="thead"><span class="badge bg-${g.bg}" style="color:${g.color}">${ic(g.icon)}</span><h2 id="h-${g.id}">${esc(g.title[lang])}<small lang="${other}">${esc(g.title[other])}</small></h2></div>
    <p>${esc(g.intro[lang])}</p>
    <div class="items">${g.items.map(i=>`<article class="item">
      <h3>${esc(i.t[lang])}</h3>
      <span class="src">${i.in?`<span class="tool">${esc(t.tool)}</span>`:`${esc(t.from)}: ${esc(i.src)}`}${i.ne?` <span class="ne-tag">${esc(t.nepali)}</span>`:""}</span>
      <p>${esc(i.d[lang])}</p>
      <div class="acts">${i.tel?`<a class="btn tel" href="${telHref(i.tel)}">${ic("phone")}${esc(i.tel)}</a>`:""}
        <a class="btn ${i.in?"pri":"out"}" href="${i.url}"${i.in?"":' target="_blank" rel="noopener"'}>${esc(t.open)} ${ic(i.in?"arrow":"ext")}</a>
        ${i.more?`<a class="btn out" href="${i.more}" target="_blank" rel="noopener">${esc(t.more)} ${ic("ext")}</a>`:""}
        ${(i.links||[]).map(x=>`<a class="btn out" href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])} ${ic("ext")}</a>`).join("")}</div>
    </article>`).join("")}</div></section>`).join("");
  markTab();
}
function markTab(){
  let cur=G[0].id;for(const g of G){const el=$(g.id);if(el&&el.getBoundingClientRect().top<180)cur=g.id}
  document.querySelectorAll("#tabs a").forEach(a=>{const on=a.dataset.id===cur;a.setAttribute("aria-current",on);if(on&&a.scrollIntoView&&a.offsetParent){const p=$("tabs");p.scrollLeft=a.offsetLeft-16}});
}
addEventListener("scroll",()=>requestAnimationFrame(markTab),{passive:true});
Sathi.onLang(render);
if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),50)}
</script>
</body>
</html>
