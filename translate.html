<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sx-paper);color:var(--sx-text);font:400 17px/1.6 var(--sx-f)}
a{color:var(--sx-green)}
:focus-visible{outline:3px solid var(--sx-blue);outline-offset:3px;border-radius:8px}
[lang=ja],.ja{font-family:var(--sx-jp)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

.intro{color:var(--sx-muted);margin:0 0 14px}
.card{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:20px;box-shadow:var(--sx-shadow);padding:16px;margin-bottom:12px}
.warn{background:var(--sx-butter);border-radius:16px;padding:12px 14px;font-size:15px;margin-bottom:14px}
.warn summary{font-weight:700;cursor:pointer}
.warn ul{margin:6px 0 0;padding-left:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.seg button{border:1px solid var(--sx-line);background:var(--sx-card);border-radius:999px;padding:7px 13px;font:600 15px var(--sx-f);cursor:pointer;color:var(--sx-text)}
.seg button[aria-pressed=true]{background:var(--sx-green);border-color:var(--sx-green);color:#fff}
.seg.small button{padding:5px 11px;font-size:14px}
@media (prefers-color-scheme:dark){.seg button[aria-pressed=true],.btn.pri{color:#0B1715}}
textarea.in,input.in,select.in{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--sx-line);border-radius:12px;background:var(--sx-paper);color:var(--sx-text)}
textarea.in{min-height:84px;resize:vertical}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:12px;font-weight:700;font-size:15px;border:0;cursor:pointer;font-family:inherit;background:var(--sx-card);color:var(--sx-green);box-shadow:inset 0 0 0 2px var(--sx-line)}
.btn.pri{background:var(--sx-green);color:#fff;box-shadow:none}
.btn.mini{min-height:34px;padding:0 10px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.mic{width:100%;min-height:64px;font-size:19px;border-radius:18px}
.mic.on{background:#B4233A;color:#fff;box-shadow:none}
.live{min-height:24px;color:var(--sx-muted);font-family:var(--sx-jp);margin:8px 2px}
.small{font-size:14px;color:var(--sx-muted)}
.ja{font-size:21px;line-height:1.9;font-weight:500}
.ne{font-size:18px;font-weight:600}
.en{color:var(--sx-muted)}
.tip{background:var(--sx-mint);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:16px}
.err{background:var(--sx-peach);border-radius:12px;padding:10px 12px;margin-top:8px}
.pending{opacity:.75}
ruby rt{font-size:.5em;color:var(--sx-teal)}
ruby.kw{cursor:pointer;border-bottom:1px dotted var(--sx-green-2)}
body.nofuri ruby rt{visibility:hidden}
.words{display:grid;gap:6px;margin-top:10px}
.wrow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:8px 10px;border:1px solid var(--sx-line);border-radius:12px;cursor:pointer;background:var(--sx-paper);text-align:left;font:inherit;color:inherit}
.wrow b{font-family:var(--sx-jp);font-size:18px}
.wrow small{color:var(--sx-muted);display:block}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px;margin-right:4px;background:var(--sx-sky);color:var(--sx-blue)}

.ex{border-left:3px solid var(--sx-line);padding:4px 10px;margin:8px 0}
.ex .ja{font-size:18px}
.rule{background:var(--sx-paper);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:15px}

<a class="sx-sr" href="#main">Skip to content</a>
<header id="sxHead"></header>
<main class="wrap" id="main">
  <h1 data-t="h1"></h1>
  <p class="intro" data-t="intro"></p>

  <details class="warn" id="warn" open>
    <summary data-t="warnH"></summary>
    <ul id="warnList"></ul>
  </details>

  <div class="card" id="codeBox" hidden>
    <label for="code" style="font-weight:700" data-t="codeL"></label>
    <div class="acts" style="margin-top:6px"><input class="in" id="code" autocomplete="off" style="flex:1;min-width:0"><button class="btn pri" id="codeSave" data-t="codeSave"></button></div>
  </div>

  <div class="seg" id="tabs" role="tablist">
    <button data-tab="boss" aria-pressed="true" data-t="tBoss"></button>
    <button data-tab="reply" aria-pressed="false" data-t="tReply"></button>
    <button data-tab="study" aria-pressed="false" data-t="tStudy"></button>
    <button data-tab="notes" aria-pressed="false" data-t="tNotes"></button>
    <button data-tab="review" aria-pressed="false" data-t="tReview"></button>
  </div>

  <!-- 1. Boss: Japanese → Nepali + English -->
  <section data-panel="boss">
    <div class="card">
      <button class="btn pri mic" id="micBtn" hidden></button>
      <div class="live" id="live" aria-live="polite"></div>
      <label class="small" for="jaIn" data-t="jaInL"></label>
      <textarea class="in" id="jaIn" lang="ja" maxlength="600"></textarea>
      <div class="acts">
        <button class="btn pri" id="jaGo" data-t="translate"></button>
        <button class="btn mini" id="furiBtn"></button>
        <button class="btn mini" id="clearFeed" data-t="clear"></button>
      </div>
      <p class="small" id="micHint" style="margin:8px 0 0"></p>
      <div class="left" id="left1"></div>
    </div>
    <div id="feed"></div>
  </section>

  <!-- 2. Reply: Nepali / English → polite Japanese -->
  <section data-panel="reply" hidden>
    <div class="card">
      <label class="small" for="myIn" data-t="myInL"></label>
      <textarea class="in" id="myIn" maxlength="600"></textarea>
      <div class="acts"><button class="btn pri" id="replyGo" data-t="makeJa"></button></div>
      <div class="left" id="left2"></div>
    </div>
    <div id="rfeed"></div>
  </section>

  <!-- 3. Study a line -->
  <section data-panel="study" hidden>
    <div class="card">
      <label class="small" for="stIn" data-t="stInL"></label>
      <textarea class="in" id="stIn" lang="ja" maxlength="300"></textarea>
      <div class="acts"><button class="btn pri" id="stGo" data-t="breakdown"></button></div>
      <div class="left" id="left3"></div>
    </div>
    <div id="sfeed"></div>
  </section>

  <!-- 4. Notes: words / grammar / lines / history (saved on this phone only) -->
  <section data-panel="notes" hidden>
    <div class="seg small" id="nbMode">
      <button data-nb="words" aria-pressed="true" data-t="nWords"></button>
      <button data-nb="grammar" aria-pressed="false" data-t="nGrammar"></button>
      <button data-nb="lines" aria-pressed="false" data-t="nLines"></button>
      <button data-nb="history" aria-pressed="false" data-t="nHistory"></button>
    </div>
    <div class="card" id="addWordBox">
      <div class="acts" style="margin:0"><input class="in" id="wAdd" lang="ja" maxlength="30" style="flex:1;min-width:0"><button class="btn pri" id="wAddBtn" data-t="lookUp"></button></div>
    </div>
    <input class="in" id="nFind" style="margin-bottom:12px">
    <p class="small" data-t="phoneOnly"></p>
    <div id="nList"></div>
  </section>

  <!-- 5. Review flashcards -->
  <section data-panel="review" hidden>
    <div class="seg small" id="rvMode">
      <button data-rv="all" aria-pressed="true" data-t="rAll"></button>
      <button data-rv="words" aria-pressed="false" data-t="nWords"></button>
      <button data-rv="grammar" aria-pressed="false" data-t="nGrammar"></button>
      <button data-rv="lines" aria-pressed="false" data-t="nLines"></button>
    </div>
    <div id="rvBox"></div>
  </section>
</main>
<footer id="sxFoot"></footer>

<button class="btn pri" id="selBtn" hidden></button>
<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

// Listening with the browser's own speech recognition (free). Sends each finished sentence after a short pause.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, buf = "", pauseT = null;
function syncMic() {
  $("micBtn").hidden = !SR;
  $("micBtn").textContent = listening ? t().micStop : t().micStart;
  $("micBtn").classList.toggle("on", listening);
  $("micHint").textContent = SR ? t().micHint : t().micNo;
}
function flush() { const s = buf.trim(); buf = ""; if (s) translateJa(s); }

  rec = new SR(); rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = ev => {
    let interim = "";

      const r = ev.results[i];
      if (r.isFinal) { buf += r[0].transcript; clearTimeout(pauseT); pauseT = setTimeout(flush, 1500); }
      else interim += r[0].transcript;
    }
    $("live").textContent = (buf + interim) || t().listening;
  };
  rec.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") { listening = false; $("live").textContent = t().micDenied; syncMic(); }
  };
  rec.onend = () => { if (listening) { try { rec.start(); } catch (_) { setTimeout(() => listening && startRec(), 400); } } };
  try { rec.start(); } catch (_) {}
}
$("micBtn").onclick = () => {
  if (listening) { listening = false; try { rec && rec.stop(); } catch (_) {} clearTimeout(pauseT); flush(); $("live").textContent = ""; }
  else { listening = true; $("live").textContent = t().listening; startRec(); }
  syncMic();
};

  if (b.dataset.gsay && st?.data) { const [i, j] = b.dataset.gsay.split(":"); return speakJa(st.data.points[+i].examples[+j].ja); }
  if (b.dataset.gsave && st?.data) { saveGrammar(st.data.points[+b.dataset.gsave], st.ctx); return renderGrammar(true); }
  if (b.dataset.gans && st?.data) { const i = +b.dataset.gans; keepInput(i); st.checks[i] = { ...(st.checks[i] || {}), show: true }; return renderGrammar(true); }
  if (b.dataset.gcheck && st?.data) return checkPractice(+b.dataset.gcheck);
});
function armed(b) {   // first tap asks "Delete?", second tap deletes
  if (b.dataset.armed) return true;
  b.dataset.armed = 1; const old = b.textContent; b.textContent = t().delQ;
  setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; } }, 2500);
  return false;
}

// Select any Japanese text in a card (long-press) → "Look up"
let selPending = null;
document.addEventListener("selectionchange", () => {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { setTimeout(() => { if (!getSelection()?.toString()) { $("selBtn").hidden = true; selPending = null; } }, 300); return; }
  const r = sel.getRangeAt(0), n = r.commonAncestorContainer;
  const host = (n.nodeType === 1 ? n : n.parentElement)?.closest("[data-ctx]");
  const f = r.cloneContents(); f.querySelectorAll?.("rt").forEach(x => x.remove());
  const s = f.textContent.trim();
  if (!host || !s || s.length > 15 || !/[぀-ヿ一-鿿]/.test(s)) { $("selBtn").hidden = true; return; }
  selPending = { s, ctx: host.dataset.ctx };
  $("selBtn").textContent = t().selLook(s); $("selBtn").hidden = false;
});
$("selBtn").addEventListener("click", e => { e.stopPropagation(); if (selPending) { const p = selPending; getSelection()?.removeAllRanges(); $("selBtn").hidden = true; openWord(p.s, p.ctx); } });

// ---------- 4. Notes ----------
let nbMode = "words";
function dayLabel(ms) {
  const d = new Date(ms), k = d.toDateString();
  if (k === new Date().toDateString()) return t().today;
  if (k === new Date(Date.now() - 864e5).toDateString()) return t().yesterday;
  return d.toLocaleDateString(lang === "ne" ? "ne-NP" : "en-GB", { weekday: "short", day: "numeric", month: "short" });
}
function renderNotes() {
  const q = $("nFind").value.trim().toLowerCase(), has = (...xs) => !q || xs.some(x => String(x || "").toLowerCase().includes(q));
  $("addWordBox").hidden = nbMode !== "words";
  let html = "";
  if (nbMode === "words") {
    const L = words.filter(w => has(w.word, w.reading, w.en, w.ne) || (w.examples || []).some(e => has(e.ja)));
    html = L.map(w => `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px"><span class="wbig" lang="ja" style="font-size:28px">${wordRuby(w)}</span>
        <span><button class="btn mini" data-nsay="${esc(w.reading || w.word)}">🔊</button> <button class="btn mini" data-wdel="${esc(w.id)}">${t().del}</button></span></div>
      <div>${w.pos ? `<span class="tag">${esc(w.pos)}</span>` : ""}${w.jlpt ? `<span class="tag ok">${esc(w.jlpt)}</span>` : ""}</div>
      <div class="ne">${esc(w.ne)}</div><div class="en">${esc(w.en)}</div>${w.note ? `<div class="tip">${esc(w.note)}</div>` : ""}
      ${(w.examples || []).map(e => `<div class="ex" data-ctx="${reg(e)}"><div class="ja" lang="ja">${furiHTML(e.furi, e.ja)} <button class="btn mini" data-a="say">🔊</button></div><div class="small">${esc(e.ne)} · ${esc(e.en)}</div></div>`).join("")}
    </div>`).join("") || `<div class="empty">${words.length ? t().noMatch : t().noWords}</div>`;
  } else if (nbMode === "grammar") {
    const L = gpoints.filter(g => has(g.pattern, g.name, g.ne, g.en, g.rule));
    html = L.map(g => `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px"><span class="gpat" lang="ja">${esc(g.pattern)}</span><button class="btn mini" data-gdel="${esc(g.id)}">${t().del}</button></div>
      <div style="font-weight:700">${esc(g.name)}</div>
      <div><span class="tag">${esc(g.level)}</span><span class="tag ${g.everyday ? "ok" : "bad"}">${g.everyday ? t().daily : t().movie}</span></div>
      <div class="ne" style="margin-top:6px">${esc(g.ne)}</div><div class="en" style="font-size:15px">${esc(g.en)}</div>
      <div class="rule"><b>${t().howTo}:</b> <span lang="ja">${esc(g.rule)}</span></div>
      ${[...(g.examples || []), ...(g.sources || [])].map(x => `<div class="ex" data-ctx="${reg(x)}"><div class="ja" lang="ja">${furiHTML(x.furi, x.ja)} <button class="btn mini" data-a="say">🔊</button></div><div class="small">${esc(x.ne)} · ${esc(x.en)}</div></div>`).join("")}
    </div>`).join("") || `<div class="empty">${gpoints.length ? t().noMatch : t().noGram}</div>`;
  } else if (nbMode === "lines") {
    html = lines.filter(l => has(l.ja, l.en, l.ne)).map(l => lineCard(l, { del: true })).join("") || `<div class="empty">${lines.length ? t().noMatch : t().noLines}</div>`;
  } else {
    const days = {};
    hist.filter(h => has(h.ja, h.en, h.ne)).forEach(h => { const k = new Date(h.t).toDateString(); (days[k] = days[k] || []).push(h); });
    html = Object.entries(days).sort((a, b) => b[1][0].t - a[1][0].t).map(([k, items]) => `<details class="day"${items[0].t > Date.now() - 864e5 ? " open" : ""}>
      <summary>${esc(dayLabel(items[0].t))} · ${items.length} <button class="btn mini" data-hdel="${esc(k)}" style="margin-left:8px">${t().delDay}</button></summary>
      ${items.slice().reverse().map(h => lineCard(h, { time: new Date(h.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) })).join("")}</details>`).join("")
      || `<div class="empty">${hist.length ? t().noMatch : t().noHist}</div>`;
  }
  $("nList").innerHTML = html;
}
$("nList").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.nsay) return speakJa(b.dataset.nsay, 0.85);
  if (b.dataset.wdel && armed(b)) { words = words.filter(w => w.id !== b.dataset.wdel); saveAll(); renderNotes(); }
  if (b.dataset.gdel && armed(b)) { gpoints = gpoints.filter(g => g.id !== b.dataset.gdel); saveAll(); renderNotes(); }
  if (b.dataset.hdel) { e.preventDefault(); if (armed(b)) { hist = hist.filter(h => new Date(h.t).toDateString() !== b.dataset.hdel); saveAll(); renderNotes(); } }
});
$("nFind").addEventListener("input", renderNotes);
$("nbMode").onclick = e => { const b = e.target.closest("[data-nb]"); if (!b) return; nbMode = b.dataset.nb; pressOne("nbMode", b); renderNotes(); };
$("wAddBtn").onclick = () => { const v = $("wAdd").value.trim(); if (v) { $("wAdd").value = ""; openWord(v, null); } };
$("wAdd").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("wAddBtn").click(); } });

// ---------- 5. Review (flashcards) ----------
let rvMode = "all", rvCard = null, rvShow = false;
function deck() {
  const d = [];
  if (rvMode === "all" || rvMode === "words") words.forEach(w => d.push({ k: "w", o: w }));
  if (rvMode === "all" || rvMode === "grammar") gpoints.forEach(g => d.push({ k: "g", o: g }));
  if (rvMode === "all" || rvMode === "lines") lines.forEach(l => d.push({ k: "l", o: l }));
  return d;
}
function nextCard() {
  const d = deck(); if (!d.length) { rvCard = null; return; }
  const min = Math.min(...d.map(c => c.o.score || 0));
  const pool = d.filter(c => (c.o.score || 0) <= min + 1 && c.o !== rvCard?.o);
  rvCard = (pool.length ? pool : d)[Math.floor(Math.random() * (pool.length || d.length))]; rvShow = false;
}
function renderReview() {
  const d = deck();
  if (!d.length) { $("rvBox").innerHTML = `<div class="empty">${t().rvEmpty}</div>`; return; }
  if (!rvCard || !d.some(c => c.o === rvCard.o)) nextCard();
  const { k, o } = rvCard;
  const front = k === "w" ? esc(o.word) : k === "g" ? esc(o.pattern) : esc(o.ja);
  const back = k === "w" ? `<div class="ja" lang="ja">${esc(o.reading)}</div><div class="ne">${esc(o.ne)}</div><div class="en">${esc(o.en)}</div>`
    : k === "g" ? `<div style="font-weight:700">${esc(o.name)}</div><div class="ne">${esc(o.ne)}</div><div class="rule" lang="ja">${esc(o.rule)}</div>`
    : `<div class="ja" lang="ja">${furiHTML(o.furi, o.ja)}</div><div class="ne">${esc(o.ne)}</div><div class="en">${esc(o.en)}</div>`;
  $("rvBox").innerHTML = `<div class="small">${t().rvLeft(d.length)}</div><div class="card flash">
    <div class="big" lang="ja"${k === "l" ? ' style="font-size:24px"' : ""}>${front}</div>
    ${rvShow ? `<div style="margin-top:12px">${back}</div>` : ""}
    <div class="acts" style="justify-content:center;margin-top:16px">
      <button class="btn" id="rvSay">🔊</button>
      ${rvShow ? `<button class="btn" id="rvAgain">${t().again}</button><button class="btn pri" id="rvGot">${t().got}</button>`
               : `<button class="btn pri" id="rvShowBtn">${t().reveal}</button>`}
    </div></div>`;
  $("rvSay").onclick = () => speakJa(k === "w" ? (o.reading || o.word) : k === "g" ? (o.examples?.[0]?.ja || o.pattern) : o.ja);
  if (rvShow) {
    $("rvAgain").onclick = () => { o.score = Math.max(0, (o.score || 0) - 1); saveAll(); nextCard(); renderReview(); };
    $("rvGot").onclick = () => { o.score = (o.score || 0) + 1; saveAll(); nextCard(); renderReview(); };
  } else $("rvShowBtn").onclick = () => { rvShow = true; renderReview(); };
}
$("rvMode").onclick = e => { const b = e.target.closest("[data-rv]"); if (!b) return; rvMode = b.dataset.rv; rvCard = null; pressOne("rvMode", b); renderReview(); };

// ---------- tabs, language, code ----------
function pressOne(groupId, btn) { $(groupId).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === btn ? "true" : "false")); }
function showTab(name) {
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== name);
  pressOne("tabs", $("tabs").querySelector(`[data-tab="${name}"]`));
  if (name === "notes") renderNotes();
  if (name === "review") renderReview();
  try { history.replaceState(null, "", "#" + name); } catch (_) {}
}
$("tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); };
$("codeSave").onclick = () => { store.set("tr_code", $("code").value.trim()); $("codeBox").hidden = true; };
$("code").value = store.get("tr_code", "");

function applyLang() {
  document.querySelectorAll("[data-t]").forEach(el => { const v = t()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  $("warnList").innerHTML = t().warn.map(x => `<li>${esc(x)}</li>`).join("");
  $("nFind").placeholder = t().find; $("wAdd").placeholder = t().addPh;
  $("jaIn").placeholder = "例：明日は8時に来てください"; $("myIn").placeholder = lang === "ne" ? "जस्तै: आज म अलि ढिलो आउँछु" : "e.g. I will be a little late today";
  $("stIn").placeholder = "例：何やってんの？";
  document.title = t().h1 + " – JapanMates";
  syncMic(); syncFuri();
  if (leftN !== null) showLeft(leftN);
  if (!document.querySelector('[data-panel="notes"]').hidden) renderNotes();
  if (!document.querySelector('[data-panel="review"]').hidden) renderReview();
}
window.SATHI_SHARE = { text: l => T[l].share };
if (window.Sathi && Sathi.onLang) Sathi.onLang(l => { lang = l; applyLang(); }); else applyLang();
applyLang();
if (store.get("tr_warn_seen", false)) $("warn").open = false;
$("warn").addEventListener("toggle", () => { if (!$("warn").open) store.set("tr_warn_seen", true); });
const start = (location.hash || "").slice(1);
if (["boss", "reply", "study", "notes", "review"].includes(start)) showTab(start);
</script>
