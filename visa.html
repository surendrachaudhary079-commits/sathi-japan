<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sathi Japan – Visa Renewal Guide</title>
<meta name="theme-color" content="#1B4965">
<style>
  :root{--bg:#F6F4EF;--card:#fff;--ink:#1d2327;--muted:#5f6b73;--line:#e3e0d8;--brand:#1B4965;--ok:#2A9D8F;--late:#D62828;--soon:#E9A23B;--wait:#6C757D}
  @media (prefers-color-scheme:dark){:root{--bg:#121619;--card:#1c2226;--ink:#eef1f3;--muted:#9aa6ae;--line:#2b3338;--brand:#8ec5e8}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Noto Sans JP",sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{font-size:22px;margin:0;color:var(--brand)}
  h2{font-size:18px;margin:0 0 10px}
  a{color:var(--brand)}
  a.back{color:var(--muted);font-size:15px;text-decoration:none}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
  .lang button{border:0;background:transparent;color:var(--ink);padding:8px 12px;font:inherit;font-size:15px;cursor:pointer}
  .lang button[aria-pressed=true]{background:var(--brand);color:var(--bg)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  input[type=date]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:16px}
  .check input{width:22px;height:22px;margin-top:2px;flex-shrink:0}
  .status{border-radius:14px;padding:14px;color:#fff;font-weight:700;font-size:20px;margin-top:12px}
  .status small{display:block;font-weight:400;font-size:15px;margin-top:4px;opacity:.95}
  .tl{list-style:none;margin:12px 0 0;padding:0}
  .tl li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .tl li:first-child{border-top:0}
  .tl .d{width:110px;flex-shrink:0;font-weight:700}
  .tl .past{color:var(--muted);text-decoration:line-through}
  .btn{display:block;width:100%;text-align:center;background:var(--brand);color:var(--bg);border:0;padding:14px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px;text-decoration:none}
  ol.steps{margin:0;padding-left:22px}
  ol.steps li{margin:0 0 12px}
  ol.steps li:last-child{margin:0}
  .sub{font-size:15px;color:var(--muted)}
  ul.docs{margin:6px 0 0;padding-left:20px;font-size:16px}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{border-top:1px solid var(--line);padding:7px 4px;text-align:left}
  th{font-size:13px;color:var(--muted);font-weight:600;border-top:0}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .warn{background:#fdecea;color:#8a1c1c;border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px}
  .info{background:#e8f3f1;color:#14524a;border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px}
  @media (prefers-color-scheme:dark){.warn{background:#4a1d1d;color:#ffd6d6}.info{background:#173d38;color:#cfeee8}}
  .small{font-size:13px;color:var(--muted)}
  select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  .row2{display:flex;gap:10px}
  .btn.half{flex:1}
  .btn.alt{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
</style>
</head>
<body>
<main>
  <a class="back" href="./" data-t="back"></a>
  <header>
    <h1 data-t="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en" aria-pressed="true">EN</button>
      <button data-l="ne" aria-pressed="false">नेपाली</button>
    </div>
  </header>

  <!-- 1. Expiry date and timeline -->
  <section class="card">
    <p class="label" data-t="expLabel"></p>
    <input type="date" id="exp">
    <label class="check"><input type="checkbox" id="short"><span data-t="shortStay"></span></label>
    <p class="small" data-t="savedLocal"></p>
    <div id="status"></div>
    <ol class="tl" id="tl"></ol>
    <button class="btn" id="ics" hidden data-t="addCal"></button>
  </section>

  <!-- 2. Renewal or change? -->
  <section class="card">
    <h2 data-t="whichH"></h2>
    <p style="margin:0" data-t="whichP"></p>
    <div class="info" data-t="whichInfo"></div>
  </section>

  <!-- 3. Steps -->
  <section class="card">
    <h2 data-t="stepsH"></h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <!-- 4. Documents -->
  <section class="card">
    <h2 data-t="docsH"></h2>
    <p class="sub" style="margin:0" data-t="docsAll"></p>
    <ul class="docs" id="docs"></ul>
    <p class="sub" data-t="docsMore"></p>
    <a href="https://www.moj.go.jp/isa/applications/procedures/16-3.html" target="_blank" rel="noopener" data-t="docsLink"></a>
  </section>

  <!-- 4b. Forms -->
  <section class="card">
    <h2 data-t="formH"></h2>
    <p class="sub" style="margin-top:0" data-t="formP"></p>
    <div class="row2" style="margin-bottom:10px">
      <button class="btn half" id="kRenew" style="margin-top:0" data-t="kRenew"></button>
      <button class="btn half alt" id="kChange" style="margin-top:0" data-t="kChange"></button>
    </div>
    <select id="ftype"></select>
    <div class="row2">
      <a class="btn half" id="fpdf" target="_blank" rel="noopener">PDF</a>
      <a class="btn half alt" id="fxls" target="_blank" rel="noopener">Excel</a>
    </div>
    <ul class="docs" id="ftips"></ul>
    <a href="https://www.moj.go.jp/isa/applications/procedures/16-3-1.html" target="_blank" rel="noopener" data-t="formAll"></a>
  </section>

  <!-- 5. Fees -->
  <section class="card">
    <h2 data-t="feeH"></h2>
    <p class="sub" style="margin-top:0" data-t="feeP"></p>
    <table>
      <thead><tr><th data-t="feePeriod"></th><th style="text-align:right" data-t="feeCounter"></th><th style="text-align:right" data-t="feeOnline"></th></tr></thead>
      <tbody id="fees"></tbody>
    </table>
    <div class="warn" data-t="scam"></div>
  </section>

  <!-- 6. Help -->
  <section class="card">
    <h2 data-t="helpH"></h2>
    <p style="margin:0" data-t="helpP"></p>
    <a class="btn" href="tel:0570013904" data-t="call"></a>
    <p class="sub" data-t="office"></p>
    <div class="info" data-t="legal"></div>
  </section>

  <p class="small"><span data-t="disclaimer"></span></p>
</main>

 office:"निगाता प्रिफेक्चर: निगाता शाखा कार्यालय, निगाता एयरपोर्ट टर्मिनल भवन, 3710 Matsuhama-cho, Higashi-ku, Niigata · 025-275-4735 · कार्यदिन ९:००–१६:००।",
 legal:"Sathi Japan ले बुझाउने र सम्झाउने काम मात्र गर्छ। हामी आवेदन भर्दैनौं वा बुझाउँदैनौं। आवेदनमा सशुल्क मद्दत चाहिए लाइसेन्स भएका 行政書士 वा इमिग्रेसन वकिल प्रयोग गर्नुहोस्।",
 disclaimer:"सामान्य जानकारी मात्र, भिसा वा कानुनी सल्लाह होइन। नियम र शुल्क बदलिन सक्छन् – सधैं इमिग्रेसनको वेबसाइट जाँच गर्नुहोस्। जाँच गरिएको: २०२६ अक्टोबर ३।",
 ics:["भिसा नवीकरण: आवेदन खुल्यो","भिसा नवीकरण: अहिले आवेदन दिनुहोस् (१ महिना बाँकी)","भिसा नवीकरण: अन्तिम २ हप्ता"]
}};
// Fees from 1 Oct 2026 (ISA). Online = before the ¥330–¥550 processing fee. null = not available online.
const FEES=[[10000,null],[18000,15000],[25000,21000],[33000,27000],[48000,42000],[64000,56000],[75000,65000]];
// Official renewal forms (ISA form download page 16-3-1), checked 2026-10-03
const FORMS=[["930004094.pdf","930004095.xlsx"],["930004094.pdf","930004095.xlsx"],["930004106.pdf","930004107.xlsx"],["930004110.pdf","930004111.xlsx"],["930003875.pdf","930003861.xlsx"],["930004114.pdf","930004115.xlsx"],["930004098.pdf","930004099.xlsx"]];
// Change of status forms (ISA page 16-2-1), same order
const FORMS_CHANGE=[["930004064.pdf","930004065.xlsx"],["930004064.pdf","930004065.xlsx"],["930004076.pdf","930004077.xlsx"],["930004080.pdf","930004081.xlsx"],["930003874.pdf","930003860.xlsx"],["930004084.pdf","930004085.xlsx"],["930004068.pdf","930004069.xlsx"]];
const FPAGE={r:"https://www.moj.go.jp/isa/applications/procedures/16-3-1.html",c:"https://www.moj.go.jp/isa/applications/procedures/16-2-1.html"};
const FBASE="https://www.moj.go.jp/isa/content/";
const SRC="https://www.moj.go.jp/isa/applications/procedures/16-3.html";

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lang")||"en";
const $=id=>document.getElementById(id);
$("exp").value=store.get("visa_exp")||"";
$("short").checked=store.get("visa_short")==="1";

const jpToday=()=>new Date(new Date(Date.now()+9*3600e3).toISOString().slice(0,10)+"T00:00:00Z");
const D=iso=>new Date(iso+"T00:00:00Z");
function addM(d,m){const r=new Date(d);const day=r.getUTCDate();r.setUTCDate(1);r.setUTCMonth(r.getUTCMonth()+m);const last=new Date(Date.UTC(r.getUTCFullYear(),r.getUTCMonth()+1,0)).getUTCDate();r.setUTCDate(Math.min(day,last));return r}
function addD(d,n){const r=new Date(d);r.setUTCDate(r.getUTCDate()+n);return r}
const fmt=d=>lang==="ne"?`${d.getUTCFullYear()}/${d.getUTCMonth()+1}/${d.getUTCDate()}`:d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
const yen=n=>n==null?"—":"¥"+n.toLocaleString("en");

function dates(){
  const v=$("exp").value; if(!v) return null;
  const exp=D(v), short=$("short").checked;
  return {exp, open: short?null:addM(exp,-3), rec:addM(exp,-1), urgent:addD(exp,-14), special:addM(exp,2)};
}
function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("steps").innerHTML=t.steps.map(s=>`<li><strong>${s[0]}</strong><br><span class="sub">${s[1]}</span></li>`).join("");
  $("docs").innerHTML=t.docs.map(d=>`<li>${d}</li>`).join("");
  const fi=+(store.get("visa_form")||0);
  $("ftype").innerHTML=t.ftypes.map((n,i)=>`<option value="${i}" ${i===fi?"selected":""}>${n}</option>`).join("");
  const fk=store.get("visa_kind")||"r", FS=fk==="c"?FORMS_CHANGE:FORMS;
  $("fpdf").href=FBASE+FS[fi][0]; $("fxls").href=FBASE+FS[fi][1];
  $("kRenew").classList.toggle("alt",fk!=="r"); $("kChange").classList.toggle("alt",fk!=="c");
  document.querySelector('a[data-t="formAll"]').href=FPAGE[fk];
  $("ftips").innerHTML=t.ftips.map(x=>`<li>${x}</li>`).join("");
  $("fees").innerHTML=FEES.map((f,i)=>`<tr><td>${t.periods[i]}</td><td class="n">${yen(f[0])}</td><td class="n">${yen(f[1])}</td></tr>`).join("");

  const x=dates(), today=jpToday();
  let key="none", arg="";
  if(x){
    if(today>x.exp){key="expired"}
    else if(x.open&&today<x.open){key="early";arg=fmt(x.open)}
    else if(today>=x.urgent){key="urgent";arg=fmt(x.exp)}
    else {key="open";arg=fmt(x.exp)}
  }
  const col={none:"var(--wait)",early:"var(--ok)",open:"var(--soon)",urgent:"var(--late)",expired:"var(--late)"}[key];
  const s=t.st[key]; const sub=typeof s[1]==="function"?s[1](arg):s[1];
  $("status").innerHTML=`<div class="status" style="background:${col}">${s[0]}<small>${sub}</small></div>`;
  if(x){
    const rows=[];
    if(x.open) rows.push([x.open,t.tlOpen]);
    rows.push([x.rec,t.tlRec],[x.exp,t.tlLast],[x.special,t.tlSpecial]);
    $("tl").innerHTML=rows.map(r=>`<li><span class="d ${r[0]<today?"past":""}">${fmt(r[0])}</span><span>${r[1]}</span></li>`).join("");
    $("ics").hidden=false;
  }else{$("tl").innerHTML="";$("ics").hidden=true}
}

// Build a calendar file on the phone itself – nothing is sent anywhere
function ics(){
  const x=dates(); if(!x) return;
  const t=T[lang], ymd=d=>d.toISOString().slice(0,10).replace(/-/g,"");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ev=[[x.open,t.ics[0]],[x.rec,t.ics[1]],[x.urgent,t.ics[2]]].filter(e=>e[0]&&e[0]>=jpToday());
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sathi Japan//Visa Reminder//EN","CALSCALE:GREGORIAN"];
  ev.forEach((e,i)=>L.push("BEGIN:VEVENT",`UID:visa-${ymd(x.exp)}-${i}@sathijapan.com`,`DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${ymd(e[0])}`,`DTEND;VALUE=DATE:${ymd(addD(e[0],1))}`,`SUMMARY:🪪 ${e[1]}`,
    `DESCRIPTION:Expiry ${ymd(x.exp)} – ${SRC}`,"BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:PT9H",`DESCRIPTION:${e[1]}`,"END:VALARM","END:VEVENT"));
  L.push("END:VCALENDAR");
  const blob=new Blob([L.join("\r\n")+"\r\n"],{type:"text/calendar"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sathi-visa-reminder.ics";document.body.appendChild(a);a.click();a.remove();
}
$("ics").onclick=ics;
$("kRenew").onclick=()=>{store.set("visa_kind","r");render()};
$("kChange").onclick=()=>{store.set("visa_kind","c");render()};
$("ftype").onchange=e=>{store.set("visa_form",e.target.value);render()};
$("exp").onchange=()=>{store.set("visa_exp",$("exp").value);render()};
$("short").onchange=()=>{store.set("visa_short",$("short").checked?"1":"0");render()};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lang",lang);render()});
render();
</script>
</body>
</html>
