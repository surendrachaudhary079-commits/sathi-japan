<style>
/* Sathi Japan – Garbage calendar. Green recycling theme: mint, sky, sun. */
:root{
  --paper:#F3F9F6;--surface:#FFFFFF;--text:#16302A;--muted:#4C635C;--line:#D3E5DB;
  --green:#0F6B57;--green-d:#0E5636;--mint:#E3F4EA;--mint-2:#CDEBD9;--sky:#E8F3FB;--sky-d:#2D6FA3;--sun:#FFF4CF;--sun-b:#EBC34B;
  --red:#C0392B;--shadow:0 1px 2px rgba(14,86,54,.06),0 6px 18px rgba(14,86,54,.07);
  --f:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;--jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0C1714;--surface:#13221E;--text:#E5F1EC;--muted:#9DB6AE;--line:#24392F;
  --green:#4CC38A;--green-d:#8EE0B6;--mint:#173328;--mint-2:#1E4233;--sky:#142636;--sky-d:#8EC3EC;--sun:#2D2814;--sun-b:#C9A43A;--red:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:400 17px/1.55 var(--f)}
a{color:var(--green-d)}
[lang=ja],.ja{font-family:var(--jp)}
:focus-visible{outline:3px solid var(--sky-d);outline-offset:3px;border-radius:8px}
button,select,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);margin-right:auto;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:21px;font-weight:800;line-height:1.05;color:var(--green-d);letter-spacing:-.01em}
.brand small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.areachip{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:600;cursor:pointer;max-width:230px}
.areachip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.areachip svg,.pin svg{width:18px;height:18px;flex:none;color:var(--green)}
@media (min-width:860px){.areachip{display:inline-flex}}
.lang{display:flex;background:var(--mint);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;font-size:14px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;color:var(--green-d)}
.lang button[aria-pressed=true]{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.lang button[aria-pressed=true]{color:#0C1714}}
.menubtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.menubtn svg{width:22px;height:22px}
.nav{position:absolute;right:16px;top:64px;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--text);font-weight:600}
.nav a:hover,.nav a[aria-current=page]{background:var(--mint)}
.nav a span{width:26px;text-align:center}

/* Hero */
.hero{margin:16px 0 0;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(180deg,#DDF0FB 0%,#EAF7EF 75%);border:1px solid var(--line);display:grid;grid-template-columns:1fr;min-height:180px}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(180deg,#14304A 0%,#163428 80%)}}
.hero .txt{padding:22px 20px 0;position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(26px,6.4vw,42px);line-height:1.1;font-weight:800;color:var(--green-d);letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--muted);font-size:16px;max-width:42ch}
.hero .art{width:100%;height:110px;display:block;margin-top:4px}
@media (max-width:519px){.hero p{font-size:15px}}
@media (min-width:860px){.hero{grid-template-columns:1.05fr 1fr;min-height:230px}.hero .txt{padding:36px 32px}.hero .art{margin:0;align-self:end;height:auto}}

/* Layout */
.grid{display:grid;gap:16px;margin:16px 0 0}
@media (min-width:860px){.grid{grid-template-columns:1.08fr 1fr;align-items:start}.col{display:grid;gap:16px}}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.card h2{margin:0;font-size:20px;line-height:1.25;font-weight:800;color:var(--green-d)}
.card h2 .ja{display:block;font-size:13.5px;font-weight:500;color:var(--muted);margin-top:2px}
.hd{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.hd .ic{width:30px;height:30px;flex:none;color:var(--green)}

/* Area card */
.areacard{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.areacard .btn{margin-left:auto}
@media (max-width:519px){.areacard .btn{flex-basis:100%}}
.pin{width:46px;height:46px;border-radius:14px;background:var(--mint);display:grid;place-items:center;flex:none}
.pin svg{width:26px;height:26px}
.areacard .nm{flex:1;min-width:0}
.areacard .nm b{display:block;font-size:22px;line-height:1.2;font-weight:800;overflow-wrap:anywhere}
.areacard .nm b .ro{font-weight:600;font-size:17px;color:var(--muted)}
.areacard .nm small{display:block;color:var(--muted);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;border:0;text-decoration:none;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0C1714}}
.btn.out{background:var(--surface);color:var(--green-d);box-shadow:inset 0 0 0 2px var(--mint-2)}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px;border-radius:12px}
.notice{margin-top:12px;background:var(--sky);border-radius:12px;padding:10px 12px;font-size:15px}
.notice button{border:0;background:none;color:var(--sky-d);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;margin-left:4px}

/* Next collection */
.next{background:linear-gradient(180deg,var(--mint) 0,var(--surface) 70%)}
.nextrow{display:grid;gap:12px}
.when{background:var(--green);color:#fff;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
@media (prefers-color-scheme:dark){.when{color:#0C1714}}
.when svg{width:40px;height:40px;flex:none;opacity:.95}
.when b{display:block;font-size:clamp(24px,6vw,30px);line-height:1.1;font-weight:800}
.when small{display:block;font-size:15px;opacity:.95}
.cats{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.cat{display:flex;align-items:center;gap:10px;flex:1 1 150px;min-width:0}
.cat .t{min-width:0}
.cat .t b{display:block;font-size:16px;line-height:1.2}
.cat .t small{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.gi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.gi svg{width:26px;height:26px}
.gi.sm{width:34px;height:34px;border-radius:11px}.gi.sm svg{width:20px;height:20px}
.lead{margin:12px 0 0;font-size:16px}
.lead b{color:var(--green-d)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.none{color:var(--muted)}
.empty{text-align:center;padding:8px 4px 4px}
.empty p{margin:6px 0 12px;color:var(--muted)}

/* Reminder */
.remind{background:var(--sun);border-color:color-mix(in srgb,var(--sun-b) 45%,var(--line))}
.remind .bell{width:44px;height:44px;flex:none;color:#D9A21B}
.remrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.remrow label{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.remrow select{font-size:16px;font-weight:700;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.state.on{color:var(--green-d);border-color:var(--mint-2);background:var(--mint)}
.pstatus{margin:10px 0 0;font-size:15px;font-weight:600}
.pstatus:empty{display:none}
.pstatus.err{color:var(--red)}
details.help{margin-top:10px;font-size:15px}
details.help summary{cursor:pointer;font-weight:700;color:var(--green-d)}
details.help ol{margin:8px 0 0;padding-left:20px}
details.help li{margin:0 0 6px}
.fine{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* Schedule list */
.days{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.days li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.days li:first-child{border-top:0}
.days li.tmr{background:var(--mint)}
.days li.off{background:color-mix(in srgb,var(--paper) 60%,var(--surface))}
.days .d b{display:block;font-size:16px;line-height:1.2}
.days .d small{font-size:13.5px;color:var(--muted)}
.days .c{display:grid;gap:6px}
.row{display:flex;gap:10px;align-items:center}
.row .t b{display:block;font-size:15.5px;line-height:1.25}
.row .t small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.more{margin-top:10px;width:100%}
.hol{font-size:14px;color:var(--muted);margin:10px 0 0}

/* Sorting guide */
.guide{display:grid;gap:10px}
@media (min-width:700px){.guide{grid-template-columns:1fr 1fr}}
.guide details{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.guide summary{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary .t{flex:1;min-width:0}
.guide summary b{display:block;line-height:1.25}
.guide summary small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.guide summary .rule{color:var(--green-d);font-weight:600}
.guide summary:after{content:"+";font-size:22px;color:var(--muted);font-weight:500}
.guide details[open] summary:after{content:"–"}
.guide ul{margin:0;padding:0 16px 14px 36px;font-size:15.5px}
.guide li{margin:0 0 6px}
.guide .bulkyacts{padding:0 14px 14px;display:flex;flex-wrap:wrap;gap:8px}
.notes{margin-top:12px;font-size:15px;background:var(--sky);border-radius:14px;padding:12px 14px}
.notes p{margin:0 0 6px}.notes p:last-child{margin:0}

/* Features */
.feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
@media (min-width:860px){.feats{grid-template-columns:repeat(4,1fr)}}
.feat{background:var(--mint);border-radius:18px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.feat svg{width:34px;height:34px;flex:none;color:var(--green)}
.feat b{display:block;font-size:15.5px;line-height:1.25;color:var(--green-d)}
.feat small{display:block;font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px}

footer.foot{margin-top:24px;background:var(--green-d);color:#E7F5EE}
@media (prefers-color-scheme:dark){footer.foot{background:#0A2A1D}}
footer.foot .wrap{padding-top:22px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;font-size:14px}
footer.foot a{color:#fff}
footer.foot .fb{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:#fff}
footer.foot .fb svg{width:30px;height:30px}

/* Loading / error */
.skel{height:18px;border-radius:8px;background:linear-gradient(90deg,var(--mint) 0,var(--surface) 50%,var(--mint) 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.errbox{border-color:var(--red)}

/* Sheets */
.sheet{position:fixed;inset:0;background:rgba(6,25,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:22px}}
.panel h2{font-size:23px;margin:0 0 4px;color:var(--green-d)}
.close{float:right;border:0;background:var(--mint);color:var(--green-d);font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer}
.hint{font-size:15px;color:var(--muted);margin:8px 0 0}
.cities{display:grid;gap:8px;margin:14px 0}
.cities button{display:block;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;cursor:pointer}
.cities button b{display:block;color:var(--green-d);font-size:17px}
.cities button span{font-size:14.5px;color:var(--muted)}
.cities button[aria-pressed=true]{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.wards{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.wards button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:14.5px;cursor:pointer}
.wards button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:16px}
.towns{list-style:none;margin:10px 0 0;padding:0}
.towns button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 4px;cursor:pointer}
.towns button b{font-weight:700;color:var(--green-d)}
.towns button small{display:block;color:var(--muted);font-size:13.5px}
.towns .emp{color:var(--muted);padding:10px 4px}
.links{list-style:none;padding:0;margin:12px 0 0}
.links a{display:block;padding:10px 4px;border-top:1px solid var(--line);font-weight:700;text-decoration:none}
ol.steps{margin:14px 0 0;padding-left:22px}
ol.steps li{margin:0 0 10px}
</style>
</head>

// ---------- Area: saved choice + ?area=<city>.<town> ----------
function validSel(s){return s&&A&&A.cities.some(c=>c.id===s.c&&c.towns[s.t])}
function initArea(){
  try{sel=JSON.parse(store.get("area")||"null")}catch(e){sel=null}
  // Earlier testers (Oodori-only list) → same town in the all-Niigata list
  if(sel){const nc=A.cities.find(c=>c.legacy&&c.legacy[sel.c]);if(nc&&nc.legacy[sel.c][sel.t]!=null){sel={c:nc.id,t:nc.legacy[sel.c][sel.t]};store.set("area",JSON.stringify(sel))}}
  if(!validSel(sel))sel=null;
  // The link always wins: it opens the area in the link and keeps it (with an Undo)
  const raw=new URLSearchParams(location.search).get("area")||"";
  const m=/^([a-z-]{2,30})\.(\d{1,5})$/.exec(raw);
  if(m){const s={c:m[1],t:+m[2]};
    if(validSel(s)){if(!sel||sel.c!==s.c||sel.t!==s.t){prevSel=sel;sel=s;store.set("area",JSON.stringify(sel))}}
  }
  syncUrl();
}

function jpNow(){return new Date(Date.now()+9*3600e3)}
function iso(off){const d=jpNow();d.setUTCDate(d.getUTCDate()+off);return d.toISOString().slice(0,10)}
function ymdFmt(k,long){const t=T[lang],d=new Date(k+"T00:00:00Z");return lang==="ne"?`${t.months[d.getUTCMonth()]} ${d.getUTCDate()}, ${(long?t.days:t.dshort)[d.getUTCDay()]}`:`${(long?t.days:t.dshort)[d.getUTCDay()]}, ${d.getUTCDate()} ${t.months[d.getUTCMonth()]} ${long?d.getUTCFullYear():""}`.trim()}
// Same rules as api/_lib.js idsFor/calIds. Returns null when no official data for that date.
function idsFor(k,s){
  s=s||sel;const c=s&&A.cities.find(x=>x.id===s.c),t=c&&c.towns[s.t];
  if(!c||!t||t.special) return null;
  if(c.validUntil&&k>c.validUntil) return null;
  if(c.type==="dated") return c.schedule[k]||[];
  if(c.type==="cal") return calIds(c.calendars[t.cal],k,c.categories);
  const d=new Date(k+"T00:00:00Z"),wd=d.getUTCDay(),md=k.slice(5);
  if(c.noCollection&&c.noCollection.includes(md)) return [];
  const out=[];
  if(t.res.includes(wd)) out.push("res");
  if(t.burn.includes(wd)) out.push("burn");
  if(t.metal.wd===wd&&t.metal.nth.includes(Math.ceil(d.getUTCDate()/7))) out.push("metal");
  return out;
}

  if(m===12&&d===31) return ["burnable"];
  let shift=false;
  if(cal.jan&&m===1) for(let x=1;x<=3;x++){const w=new Date(Date.UTC(dt.getUTCFullYear(),0,x)).getUTCDay();if(SHIFT.some(id=>cal.r[id]&&hit(cal.r[id],w,x)))shift=true}
  const out=[];
  for(const cg of cats){const r=cal.r[cg.id];if(!r||(r.off&&r.off.includes(m)))continue;
    let dd=d;if(shift&&SHIFT.includes(cg.id)){dd=d-7;if(dd<1)continue}
    if(hit(r,wd,dd))out.push(cg.id)}
  return out;
}
function putTime(){const c=city(),tw=town();return c&&c.type==="cal"&&tw?c.calendars[tw.cal].put:"08:00"}

function fold(line){const enc=new TextEncoder();let out=[],cur="";for(const ch of line){if(enc.encode(cur+ch).length>74){out.push(cur);cur=" "+ch}else cur+=ch}out.push(cur);return out.join("\r\n")}
function downloadIcs(){
  const c=city(),tw=town();if(!c||!tw)return;
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",e2=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const area=`${areaLabel(c,tw)}, ${c.name.en} (${c.name.ja})`,src=c.type==="cal"?c.calendars[tw.cal].url:c.source,pt=putTime(),h=remindHour();
  // Alarm at the chosen reminder time: evening → the day before; morning → the same day
  const trig=h>=12?`-PT${24-h}H`:`PT${h}H`;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sathi Japan//Garbage//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",`X-WR-CALNAME:${e2("Sathi – Garbage "+areaLabel(c,tw))}`,"X-WR-TIMEZONE:Asia/Tokyo"];
  let n=0;
  for(let i=0;i<220;i++){
    const k=iso(i),x=idsFor(k);if(x===null)break;if(!x.length)continue;n++;
    const ymd=k.replace(/-/g,""),nd=new Date(k+"T00:00:00Z");nd.setUTCDate(nd.getUTCDate()+1);
    const sum="🗑 "+x.map(id=>catOf(c,id).en).join(" + ");
    const desc=x.map(id=>{const cg=catOf(c,id);return `${cg.en} / ${cg.ne} / ${cg.ja}`}).join("\n")+`\n\nPut out by ${T.en.times[pt]||pt} / ${T.ne.times[pt]||pt} भित्र.\nArea: ${area}\nOfficial calendar: ${src}\nFrom Sathi Japan – always follow your collection point's notices.`;
    L.push("BEGIN:VEVENT",`UID:${c.id}-${sel.t}-${ymd}@sathijapan.com`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ymd}`,`DTEND;VALUE=DATE:${nd.toISOString().slice(0,10).replace(/-/g,"")}`,
      `SUMMARY:${e2(sum)}`,`DESCRIPTION:${e2(desc)}`,`LOCATION:${e2(area)}`,"TRANSP:TRANSPARENT",
      "BEGIN:VALARM","ACTION:DISPLAY",`TRIGGER:${trig}`,`DESCRIPTION:${e2(sum)}`,"END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  const st=$("icsStatus");st.className="pstatus";
  if(!n){st.textContent=T[lang].icsNone;return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.map(fold).join("\r\n")+"\r\n"],{type:"text/calendar;charset=utf-8"}));
  a.download=`sathi-garbage-${c.id}-${sel.t}.ics`;document.body.appendChild(a);a.click();a.remove();
  st.textContent=T[lang].icsDone;
}

async function sendSub(sub,test){
  const r=await fetch("/api/subscribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sub:sub.toJSON(),city:sel.c,town:sel.t,lang,hour:remindHour(),test})});
  if(!r.ok){let j={};try{j=await r.json()}catch(_){}throw new Error((j.error||"server")+" "+(j.status||r.status))}
}
async function toggleRemind(){
  if(remindOn()) return turnOff();
  if(!pushOK){if(isIOS&&!standalone){$("iosSheet").hidden=false;return}return pstatus("pNo",1)}
  if(Notification.permission==="denied") return pstatus("pBlocked",1);
  try{
    pstatus("pWait");
    const perm=await Notification.requestPermission();
    if(perm!=="granted") return pstatus("pBlocked",1);
    const reg=await navigator.serviceWorker.ready;
    const kr=await fetch("/api/subscribe");if(!kr.ok)throw new Error("server");
    const {publicKey}=await kr.json();if(!publicKey)return pstatus("pServer",1);
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(publicKey)});
    await sendSub(sub,true);
    store.set("remind","1");renderReminder();pstatus("pOn");
  }catch(e){console.error(e);pstatus("pErr",1);$("pushStatus").textContent+=` (${String(e.message||e.name||e).slice(0,80)})`}
}
async function turnOff(){
  try{
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    // Keep the phone's push address if "My deadlines" or rate alerts still use it
    if(sub){await fetch("/api/unsubscribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})});if(store.get("dl_remind")!=="1"&&store.get("fx_on")!=="1")await sub.unsubscribe();}
  }catch(e){console.error(e)}
  store.set("remind","0");renderReminder();pstatus("pOff");
}
// Area, language or time changed → update the saved reminder (the server keeps one row per phone, so no duplicates)
async function updateRemind(){
  if(!remindOn()||!pushOK||!town()||town().special) return;
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){await sendSub(sub,false);return true}}catch(e){console.error(e)}
}

// ---------- Wire up ----------
function share(){
  const t=T[lang],c=city(),tw=town();if(!c||!tw)return;
  const nx=nextFrom(1),nxt=nx&&nx.ids?`${nx.k===1?t.tomorrow:ymdFmt(iso(nx.k))} – ${nx.ids.map(id=>catOf(c,id)[lang]).join(t.and)}`:"";
  sathiShare({text:t.shareMsg(areaLabel(c,tw),c.name[lang],nxt),url:`${location.origin}/garbage.html?area=${sel.c}.${sel.t}`});
}
function boot(){
  if(!A||!A.cities){ // areas.js failed to load
    $("main").hidden=true;$("errBox").hidden=false;
    $("errBox").innerHTML=`<p style="margin:0 0 10px"><b>⚠️ ${esc(T[lang].errData)}</b></p><button class="btn pri" onclick="location.reload()">${esc(T[lang].reload)}</button>`;
    document.querySelectorAll("[data-t]").forEach(e=>{const v=T[lang][e.dataset.t];if(typeof v==="string")e.textContent=v});return;
  }
  initArea();render();
  $("changeBtn").onclick=openPicker;$("areaChip").onclick=openPicker;
  $("closePick").onclick=closePicker;$("sheet").onclick=e=>{if(e.target.id==="sheet")closePicker()};
  $("closeIos").onclick=()=>{$("iosSheet").hidden=true};$("iosSheet").onclick=e=>{if(e.target.id==="iosSheet")$("iosSheet").hidden=true};
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePicker();$("iosSheet").hidden=true;closeNav()}});
  $("remind").onclick=toggleRemind;
  $("hour").onchange=async e=>{store.set("remindHour",e.target.value);renderReminder();if(remindOn()){if(await updateRemind())pstatus("pTime",0,hh(+e.target.value))}};
  $("moreBtn").onclick=()=>{span=span>14?14:42;renderSchedule(city(),town())};
  $("icsBtn").onclick=downloadIcs;$("shareBtn").onclick=share;
  document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lang",lang);render();updateRemind()});
  $("menuBtn").onclick=e=>{e.stopPropagation();const o=$("nav").hidden;$("nav").hidden=!o;$("menuBtn").setAttribute("aria-expanded",o)};
  document.addEventListener("click",e=>{if(!$("nav").hidden&&!$("nav").contains(e.target))closeNav()});
  // Keep "today / tomorrow" right if the page stays open past midnight or the put-out time
  let tick=iso(0)+jpNow().getUTCHours();
  setInterval(()=>{const k=iso(0)+jpNow().getUTCHours();if(k!==tick&&$("sheet").hidden){tick=k;render()}},60e3);
}
function closeNav(){$("nav").hidden=true;$("menuBtn").setAttribute("aria-expanded","false")}
boot();
</script>
