 rules:[["Drive on the left.","wakayamaEn"],["Legal speed (no sign): 60 km/h on general roads with a centre line or lanes, 100 km/h on expressways. Since 1 Sep 2026: 30 km/h on residential roads without a centre line.","fukuokaSpeed"],["Railway crossings: make a full stop, even with no alarm.","fukuokaRulesEn"],["Crosswalks: stop if a pedestrian is crossing or about to cross.","fukuokaRulesEn"],["Alcohol: driving with 0.15 mg/L breath alcohol or more is a crime. Car lenders, alcohol providers and passengers can be punished too.","npaAlcohol"],["Phone: holding it while driving – ¥18,000 penalty and 3 points (ordinary car).","npaPhone"],["Seat belts in all seats. Child seats for children under 6.","npaSeatbelt"],["Beginner mark for the first year of an ordinary licence.","tokyoMark"],["No stopping or parking within 5 m of an intersection or crosswalk, 10 m of a bus stop or railway crossing, 5 m of a fire hydrant.","aichiParking"],["Bicycles: ride on the left of the roadway; helmets expected; blue-ticket fines for ages 16+ from 1 Apr 2026.","npaBicycle"]],

 af:[["Renewal (更新)",["Renew in the 2 months around your birthday: from 1 month before to 1 month after.","A renewal notice postcard is sent to you (Niigata: about 40 days before your birthday).","Courses: gold (優良) 30 min, general 60 min, first renewal 120 min. Gold = licensed 5+ years with no accidents or violations for 5 years.","With a マイナ免許証 you can take the gold or general course online, then go for the eye test.","Niigata general renewal: ¥2,850 + ¥800 course = ¥3,650."],["npaJapan","naganoRenewal","yamanashiRenewal","npaMyna","niigataRenewInfo","niigataRenewal"]],
  ["Address or name change",["Report it promptly at a licence centre or police station. Not reporting can be fined up to ¥20,000.","Bring your licence and your residence card or 住民票."],["npaJapan","niigataAddress"]],
  ["Lost or damaged licence",["Apply for a reissue (再交付) with a photo and original ID.","Niigata: ¥2,600 for a lost card; same day at the centre, about 3 weeks at police stations."],["niigataReissue"]],
  ["Driving with a foreign licence or international permit",["Only Geneva Convention international driving permits are accepted (not Vienna).","You can drive up to 1 year from entering Japan, or until the permit expires – whichever is earlier.","Residents who leave Japan and return within less than 3 months do not restart the 1-year count.","A foreign licence alone (without a permit) is not enough – exchange it or get a Japanese licence."],["npaForeign","tokyoIDP"]],
  ["Driving abroad (国外運転免許証)",["Apply for a Japanese international driving permit at your licence centre or police station.","Example: Kagawa police – fee ¥2,250; bring your licence, passport and a 4.5 × 3.5 cm photo. Fees and steps can differ by prefecture."],["kagawaIDP"]],
  ["Insurance",["自賠責保険 (compulsory insurance) is required for every vehicle, including mopeds. Driving without it: up to 1 year in prison or ¥500,000 fine, and 6 points.","It pays up to ¥30 million for a death and ¥1.2 million for injuries. Most drivers also buy optional insurance (任意保険) from a private company – general guidance, compare plans yourself."],["mlitJibai"]],
  ["Driving record certificate",["Japan Safe Driving Center issues driving-record certificates (useful for jobs or insurance)."],["jsdc"]]],

 faq:[["Can I exchange my licence as a tourist?","Since 1 Oct 2025 you generally need a 住民票, so tourists and short-term visitors can no longer apply (narrow exceptions only)."],["My country is not on the exemption list. Can I still exchange?","It may still be possible if you meet the requirements, but you will take the knowledge check (50 questions, 45 to pass) and the skill check. Confirm with your centre."],["Who can translate my licence?","Your licence country's authority or its embassy/consulate in Japan, JAF, ジップラス, 訪日運転者支援協会, ADAC (Germany) or 台湾日本関係協会 (Taiwan). Private certified translators are not accepted."],["Can someone apply for me?","No. You must apply yourself."],["Is a driving school required?","No. You can take the tests directly (一発試験), but school graduates skip the skill test at the centre."],["How long can I drive with an international permit?","Up to 1 year from entering Japan or until the permit expires, whichever is earlier – Geneva Convention permits only."],["Can Sathi Japan apply or book for me?","No. We explain the rules; you book and apply at your licence centre."]],

// ---------- Countries ----------
let pickedCountry=null;
function renderCountries(){
  const t=T[lang],q=$("cq").value.trim().toLowerCase();
  $("cq").placeholder=t.countryPh;
  const list=D.COUNTRIES.filter(c=>!q||c[1].toLowerCase().includes(q)||c[2].includes(q)||c[3].includes(q)).sort((a,b)=>cName(a).localeCompare(cName(b)));
  const tag=s=>s==="ex"?`<span class="tag ex">${esc(t.coEx)}</span>`:s==="us"?`<span class="tag us">${esc(t.coUS)}</span>`:`<span class="tag no">${esc(t.coNo)}</span>`;
  $("clist").innerHTML=list.map(c=>`<li><button type="button" data-c="${c[0]}" aria-pressed="${pickedCountry===c[0]}">${esc(cName(c))} <small lang="ja" style="color:var(--sx-muted)">${esc(c[3])}</small></button>${tag(c[4])}</li>`).join("")
    +`<li><button type="button" data-c="OTHER">${esc(t.countryOther)}</button></li>`;
  $("clist").querySelectorAll("button").forEach(b=>b.onclick=()=>{pickedCountry=b.dataset.c;renderCountryResult()});
  renderCountryResult();
}
function countryStatusHtml(code){
  const t=T[lang];
  if(!code)return `<p style="margin:0;color:var(--sx-muted)">${esc(t.coPick)}</p>`;
  if(code==="OTHER")return `<div class="status st-info"><b>${esc(t.countryOther)}</b>${esc(t.rOther)}</div>`;
  const c=D.COUNTRIES.find(x=>x[0]===code);if(!c)return "";
  const s=c[4],cls=s==="ex"?"st-ok":s==="us"?"st-warn":"st-info",txt=s==="ex"?t.coExTxt:s==="us"?t.rUS:t.coNoTxt;
  return `<h3 style="margin-top:0">${esc(cName(c))} <small lang="ja" style="color:var(--sx-muted);font-weight:500">${esc(c[3])}</small></h3><div class="status ${cls}">${esc(txt)}</div><p style="font-size:15px">${esc(t.coAll)}</p><p style="font-weight:700;margin-bottom:0">${esc(t.coConfirm)}</p>${srcLinks(D.EXEMPT_SRC.concat(["npaForeign"]))}`;
}
function renderCountryResult(){$("cres").innerHTML=countryStatusHtml(pickedCountry);$("clist").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===pickedCountry))}

     <p style="margin:0 0 10px"><b>${esc(t.ceBranches)}:</b> ${info.branches.map(b=>`${esc(lang==="ne"?b[0]:b[1])} <a href="tel:${b[2].replace(/-/g,"")}">${esc(b[2])}</a>`).join(" · ")}</p>
     <div class="status st-warn"><b>${esc(t.ceEx)}: <a href="tel:${info.exchange.tel.replace(/-/g,"")}">${esc(info.exchange.tel)}</a></b>${esc(L(info.exchange.hours))} ${esc(L(info.exchange.lang))}</div>
     <div class="status st-info"><b>${esc(t.ceRenew)}</b>${esc(L(info.renewal))}</div>${srcLinks(info.srcs)}</div>`;
  }
  if(info&&info.web)return `<div class="status st-info" style="margin-top:12px"><b>${esc(nm)}</b><a href="${info.web}" target="_blank" rel="noopener">${esc(info.nameEn)} ↗</a><br>${esc(t.coConfirm)}${srcLinks(info.srcs)}</div>`;
  return `<div class="status st-info" style="margin-top:12px"><b>${esc(nm)}</b>${esc(t.ceOther(nm))}<br><a class="btn out" style="margin-top:10px" href="${D.SRC.npaPref.url}" target="_blank" rel="noopener">${esc(t.ceList)} ↗</a>${srcLinks(["npaPref"])}</div>`;
}
function renderPrefs(){
  const t=T[lang],cur=$("pref").value||store.get("dl_pref")||"";
  $("pref").innerHTML=`<option value="">${esc(t.cePh)}</option>`+D.PREFS.map(p=>`<option value="${p[0]}"${p[0]===cur?" selected":""}>${esc(prefName(p))}</option>`).join("");
  $("pres").innerHTML=prefHtml(cur);
}
$("pref").onchange=e=>{store.set("dl_pref",e.target.value);$("pres").innerHTML=prefHtml(e.target.value)};

// ---------- Checklist ----------
let clKey="exchange";
function ticks(){try{return JSON.parse(store.get("dl_ticks")||"{}")}catch(e){return {}}}
function renderChecklist(){
  const t=T[lang],cl=D.CHECKLISTS[clKey],tk=ticks();
  $("clSeg").setAttribute("aria-label",t.clH);
  $("clSeg").innerHTML=Object.keys(D.CHECKLISTS).map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===clKey}">${esc(t.clTabs[k])}</button>`).join("");
  $("clSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{clKey=b.dataset.k;renderChecklist()});
  $("clBody").innerHTML=`<h3 style="margin-top:4px">${esc(t.clTabs[clKey])}</h3><ul class="cl">${cl.items.map((it,i)=>{const id=`${clKey}-${i}`;
    return `<li><input type="checkbox" id="ck-${id}" data-id="${id}"${tk[id]?" checked":""}><label for="ck-${id}"><b>${esc(L(it.t))}<span class="need ${it.need}">${esc(it.need==="all"?t.all:t.dep)}</span></b>${it.w?`<small>${esc(L(it.w))}</small>`:""}</label></li>`}).join("")}</ul>${srcLinks(cl.src)}`;
  $("clBody").querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{const k=ticks();if(c.checked)k[c.dataset.id]=1;else delete k[c.dataset.id];store.set("dl_ticks",JSON.stringify(k))});
  $("printBtn").innerHTML=ic("book")+esc(t.print);$("clReset").textContent=t.reset;
}
$("printBtn").onclick=()=>window.print();
$("clReset").onclick=()=>{const k=ticks();Object.keys(k).forEach(x=>{if(x.startsWith(clKey+"-"))delete k[x]});store.set("dl_ticks",JSON.stringify(k));renderChecklist()};

// ---------- Costs ----------
let costKey="exchange";
function renderCosts(){
  const t=T[lang],F=D.FEES,card=+$("cardType").value||0,c=t.c;
  $("costSeg").innerHTML=Object.keys(t.costRoutes).map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===costKey}">${esc(t.costRoutes[k])}</button>`).join("");
  $("costSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{costKey=b.dataset.k;renderCosts()});
  const issue=[F.issueCard,F.issueMyna,F.issueBoth][card];
  let rows=[],srcs=[F.src,"law"],note="";
  const V=(l,v)=>rows.push([l,v]);
  if(costKey==="exchange"){V(c.exApp,F.exchangeTokyo.application);V(c.issue,issue);V(c.trans,null);V(c.doc,null);srcs=["tokyoExchange",F.src,"law","npaForeign"];note=c.exNote}
  if(costKey==="school"){V(c.school,null);V(c.testSchool,F.testOrdinarySchool);V(c.issue,issue);V(c.doc,null)}
  if(costKey==="direct"){V(c.prov,F.provisionalTest);V(c.provCard,F.provisionalCard);V(c.test,F.testOrdinaryDirect);V(c.veh,F.vehicleUse);V(c.course,"nv");V(c.issue,issue);V(c.retake,null)}
  if(costKey==="renew"){V(c.ren,F.renewalGeneral.total);srcs=["niigataRenewal","law"];note=c.renNote}
  const total=rows.reduce((s,r)=>s+(typeof r[1]==="number"?r[1]:0),0);
  $("costBody").innerHTML=`<div class="tblwrap"><table class="tbl"><thead><tr><th scope="col">${esc(t.cItem)}</th><th scope="col" class="num">${esc(t.cAmt)}</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${typeof r[1]==="number"?yen(r[1]):`<small>${esc(r[1]==="nv"?t.cNot:t.cVaries)}</small>`}</td></tr>`).join("")}
    <tr><th scope="row">${esc(t.cTotal)}</th><td class="num">${yen(total)} +</td></tr></tbody></table></div>
    ${note?`<p style="font-size:15px;margin:10px 0 0">${esc(note)}</p>`:""}<p style="font-size:14px;color:var(--sx-muted);margin:6px 0 0">${esc(c.moto)}</p>${srcLinks(srcs)}`;
}
function renderCardSel(){const t=T[lang],v=$("cardType").value||"0";$("cardType").innerHTML=t.cards.map((x,i)=>`<option value="${i}"${String(i)===v?" selected":""}>${esc(x)}</option>`).join("")}
$("cardType").onchange=renderCosts;

// ---------- Quiz (options shuffled so the answer isn't always first) ----------
let quizState={};
function order(i,n){const a=[...Array(n).keys()];let s=i*9301+49297;for(let k=n-1;k>0;k--){s=(s*9301+49297)%233280;const j=s%(k+1);[a[k],a[j]]=[a[j],a[k]]}return a}
function renderQuiz(){
  const t=T[lang],el=$("quiz");if(!el)return;
  el.innerHTML=D.QUIZ.map((q,i)=>{const st=quizState[i];return `<div class="q" data-i="${i}"><p class="qq">${i+1}. ${esc(L(q.q))}</p><div class="opts">${order(i,q.o.length).map(j=>{
    const cls=st==null?"":j===q.a?"right":j===st?"wrong":"";return `<button type="button" data-j="${j}" class="${cls}"${st!=null?' aria-disabled="true"':""}>${esc(L(q.o[j]))}</button>`}).join("")}</div>
    ${st!=null?`<p class="ex"><b>${esc(st===q.a?t.qRight:t.qWrong)}</b> ${esc(L(q.e))} <a href="${D.SRC[q.src].url}" target="_blank" rel="noopener" style="font-size:13px">${esc(D.SRC[q.src].org)} ↗</a></p>`:""}</div>`}).join("")
    +`<p style="font-weight:700">${esc(t.score(Object.entries(quizState).filter(([i,v])=>D.QUIZ[i].a===v).length,D.QUIZ.length))}</p><button class="btn out" type="button" id="qReset">${esc(t.qReset)}</button>`;
  el.querySelectorAll(".q").forEach(qd=>qd.querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+qd.dataset.i;if(quizState[i]!=null)return;quizState[i]=+b.dataset.j;renderQuiz();const n=$("quiz").querySelector(`.q[data-i="${i}"] .ex`);if(n)n.setAttribute("tabindex","-1")}));
  $("qReset").onclick=()=>{quizState={};renderQuiz()};
}

// ---------- Personalised guide ----------
let W={i:0,a:{}};
function stepsList(){const a=W.a,s=["have"];if(a.have===0){s.push("country","stay")}s.push("res","pref","veh");return s}
function renderWizard(){
  const t=T[lang],steps=stepsList(),done=W.i>=steps.length,el=$("wiz");
  if(done)return renderResult();
  const k=steps[W.i],n=steps.length,pct=Math.round(W.i/n*100);
  const radios=(name,arr)=>`<div class="opts">${arr.map((x,j)=>`<label><input type="radio" name="${name}" value="${j}"${W.a[k]===j?" checked":""}>${esc(x)}</label>`).join("")}</div>`;
  let body="";
  if(k==="have")body=`<legend>${esc(t.qHave)}</legend>${radios(k,t.aHave)}`;
  if(k==="country")body=`<legend>${esc(t.qCountry)}</legend><label class="lb sx-sr" for="wc">${esc(t.qCountry)}</label><select class="in" id="wc"><option value="">${esc(t.cePh)}</option>${D.COUNTRIES.slice().sort((a,b)=>cName(a).localeCompare(cName(b))).map(c=>`<option value="${c[0]}"${W.a.country===c[0]?" selected":""}>${esc(cName(c))}</option>`).join("")}<option value="OTHER"${W.a.country==="OTHER"?" selected":""}>${esc(t.countryOther)}</option></select>`;
  if(k==="stay")body=`<legend>${esc(t.qStay)}</legend>${radios(k,t.aStay)}`;
  if(k==="res")body=`<legend>${esc(t.qRes)}</legend>${radios(k,t.aRes)}`;
  if(k==="pref")body=`<legend>${esc(t.qPref)}</legend><label class="lb sx-sr" for="wp">${esc(t.qPref)}</label><select class="in" id="wp"><option value="">${esc(t.cePh)}</option>${D.PREFS.map(p=>`<option value="${p[0]}"${W.a.pref===p[0]?" selected":""}>${esc(prefName(p))}</option>`).join("")}</select>`;
  if(k==="veh")body=`<legend>${esc(t.qVeh)}</legend>${radios(k,t.aVeh)}`;
  el.innerHTML=`<span class="stepn">${esc(t.step(W.i+1,n))}</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
   <form id="wf" novalidate><fieldset>${body}</fieldset><p class="err" id="werr" role="alert"></p>
   <div class="wnav"><button type="button" class="btn out" id="wb"${W.i?"":" disabled"}>${esc(t.back)}</button><button type="submit" class="btn pri">${esc(W.i===n-1?t.result:t.next)}</button></div></form>`;
  $("wb").onclick=()=>{W.i=Math.max(0,W.i-1);renderWizard()};
  $("wf").onsubmit=e=>{e.preventDefault();let v;
    if(k==="country")v=$("wc").value||null;else if(k==="pref")v=$("wp").value||null;else{const r=el.querySelector("input:checked");v=r?+r.value:null}
    if(v==null){$("werr").textContent=t.choose;return}
    W.a[k]=v;if(k==="pref")store.set("dl_pref",v);W.i++;renderWizard();el.querySelector("legend,h3")&&el.querySelector("legend,h3").focus&&el.scrollIntoView({block:"nearest"})};
}
function renderResult(){
  const t=T[lang],a=W.a,el=$("wiz");let title,cls,notes=[],cl;
  if(a.res===1){title=t.rNoRes;cls="st-no";notes.push(t.rNoResTxt)}
  else if(a.have===0&&a.stay!==1){title=t.rEx;cls="st-ok";cl="exchange";
    if(a.stay===2)notes.push(t.rStayUnsure);
    const c=D.COUNTRIES.find(x=>x[0]===a.country);
    if(a.country==="OTHER"||!c)notes.push(t.rOther);else if(c[4]==="ex")notes.push(t.rExempt);else if(c[4]==="us")notes.push(t.rUS);else notes.push(t.rTests)}
  else{title=t.rNew;cls="st-info";cl=a.veh===0||a.veh==null?"newSchool":"newSchool";
    if(a.have===1)notes.push(t.rExpired);if(a.have===0&&a.stay===1)notes.push(t.rStayNo)}
  if(a.res===2)notes.push(t.rResUnsure);
  if(a.veh===3)notes.push(t.rLarge);if((a.veh===1||a.veh===2)&&cl==="exchange")notes.push(t.rMoto);
  if(cl){clKey=cl;renderChecklist()}
  el.innerHTML=`<span class="stepn">${esc(t.rTitle)}</span><div class="bar"><span style="width:100%"></span></div>
   <div class="status ${cls}" tabindex="-1" id="wres"><b style="font-size:19px">${esc(title)}</b>${notes.length?`<ul class="dots" style="margin-top:6px">${notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>
   <p style="font-weight:700">${esc(t.rConfirm)}</p>
   <h3>${esc(t.rNext)}</h3><div style="display:flex;flex-wrap:wrap;gap:8px">${cl?`<a class="btn pri" href="#checklist">${esc(t.rGo[0])}</a>`:""}<a class="btn out" href="#costs">${esc(t.rGo[1])}</a><a class="btn out" href="#centres">${esc(t.rGo[2])}</a><button class="btn out" type="button" id="wr">${esc(t.restart)}</button></div>
   ${a.pref?prefHtml(a.pref):""}${srcLinks(["npaForeign","tokyo2025"])}`;
  if(a.pref){$("pref").value=a.pref;$("pres").innerHTML=prefHtml(a.pref)}
  if(cl==="exchange")costKey="exchange";else if(cl)costKey="school";renderCosts();
  $("wr").onclick=()=>{W={i:0,a:{}};renderWizard()};
  $("wres").focus({preventScroll:true});
}

// ---------- tabs highlight ----------
function markTab(){const ids=T[lang].tabs.map(x=>x[0]);let cur=ids[0];for(const id of ids){const el=$(id);if(el&&el.getBoundingClientRect().top<160)cur=id}
  document.querySelectorAll("#tabs a").forEach(a=>{const on=a.dataset.id===cur;a.setAttribute("aria-current",on);if(on)$("tabs").scrollLeft=a.offsetLeft-16})}
addEventListener("scroll",()=>requestAnimationFrame(markTab),{passive:true});

$("cq").oninput=renderCountries;
Sathi.onLang(l=>{lang=l;document.title=(l==="ne"?"जापानमा ड्राइभिङ लाइसेन्स: पूर्ण गाइड":"Driving Licence in Japan: Complete Guide for Foreign Residents")+" – Sathi Japan";
  renderStatic();renderCountries();renderPrefs();renderChecklist();renderCardSel();renderCosts();renderWizard();markTab()});
if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),60)}
</script>
