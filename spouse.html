<style>
  :root{--bg:#F4F6FA;--card:#fff;--ink:#1B2333;--muted:#5B6B82;--line:#DCE2EC;--brand:#0B2E6B;--ok:#2A9D8F;--late:#D62828;--soon:#E9A23B}
  @media (prefers-color-scheme:dark){:root{--bg:#0C1424;--card:#131E33;--ink:#E7ECF5;--muted:#93A2BA;--line:#26344D;--brand:#A9C4F5}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 "Mukta","Noto Sans Devanagari","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.015em;margin:0;color:var(--brand)}
  h2{font-size:18px;margin:0 0 10px}
  a{color:var(--brand)}
  a.back{font-weight:800;color:var(--brand);font-size:17px;text-decoration:none}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
  .lang button{border:0;background:transparent;color:var(--ink);padding:8px 12px;font:inherit;font-size:15px;cursor:pointer}
  .lang button[aria-pressed=true]{background:var(--brand);color:var(--bg)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .label{font-size:14px;color:var(--muted);margin:0 0 6px}
  select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  .seg{display:grid;gap:8px;margin-top:8px}
  .seg button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;cursor:pointer}
  .seg button b{display:block;color:var(--brand)}
  .seg button[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
  .verdict{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px}
  .verdict.yes{background:#e8f3f1;color:#14524a}
  .verdict.no{background:#fdecea;color:#8a1c1c}
  .verdict.mid{background:#fff4e0;color:#6b4500}
  @media (prefers-color-scheme:dark){.verdict.yes{background:#173d38;color:#cfeee8}.verdict.no{background:#4a1d1d;color:#ffd6d6}.verdict.mid{background:#4a3a14;color:#ffe9b8}}
  ol.steps{margin:0;padding-left:22px}
  ol.steps li{margin:0 0 12px}
  ol.steps li:last-child{margin:0}
  .sub{font-size:15px;color:var(--muted)}
  ul.docs{list-style:none;margin:0;padding:0}
  ul.docs li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  ul.docs li:first-child{border-top:0}
  ul.docs input{width:22px;height:22px;margin-top:3px;flex-shrink:0}
  ul.docs .ja{font-weight:700}
  ul.docs .en{display:block}
  ul.docs .from{display:block;font-size:14px;color:var(--muted)}
  ul.docs a{font-size:15px}
  .count{font-size:14px;color:var(--muted);margin:0 0 6px}
  .btn{display:block;width:100%;text-align:center;background:var(--brand);color:var(--bg);border:0;padding:12px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px;text-decoration:none}
  .btn.alt{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
  .row2{display:flex;gap:10px}.row2 .btn{flex:1}
  .warn{background:#fdecea;color:#8a1c1c;border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px}
  .info{background:#e8f3f1;color:#14524a;border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px}
  @media (prefers-color-scheme:dark){.warn{background:#4a1d1d;color:#ffd6d6}.info{background:#173d38;color:#cfeee8}}
  ul.plain{margin:6px 0 0;padding-left:20px;font-size:16px}
  .small{font-size:13px;color:var(--muted)}
  [hidden]{display:none!important}
.sharebtn{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--brand,var(--navy));font:inherit;font-weight:700;font-size:16px;cursor:pointer}
</style>

<body>
<main>
  <a class="back" href="visa.html" data-t="back"></a>
  <header>
    <h1 data-t="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en" aria-pressed="true">EN</button>
      <button data-l="ne" aria-pressed="false">नेपाली</button>
    </div>
  </header>
  <p class="sub" data-t="intro"></p>
  <button class="sharebtn" id="shareBtn" data-t="share"></button>

  <!-- 1. Your situation -->
  <section class="card">
    <h2 data-t="q1"></h2>
    <p class="label" data-t="q1p"></p>
    <select id="mine"></select>
    <div id="verdict"></div>
    <div id="whereBox">
      <h2 style="margin-top:16px" data-t="q2"></h2>
      <div class="seg" id="where"></div>
    </div>
  </section>

  <div id="result">
    <!-- 2. Steps -->
    <section class="card">
      <h2 id="stepsH"></h2>
      <ol class="steps" id="steps"></ol>
    </section>

    <!-- 3. Documents -->
    <section class="card">
      <h2 data-t="docsH"></h2>
      <p class="count" id="count"></p>
      <ul class="docs" id="docs"></ul>
      <ul class="plain sub" id="rules"></ul>
      <a id="offList" target="_blank" rel="noopener" data-t="offList"></a>
    </section>

    <!-- 4. Form + fee -->
    <section class="card">
      <h2 data-t="formH"></h2>
      <p class="sub" style="margin-top:0" id="formName"></p>
      <div class="row2">
        <a class="btn" id="fpdf" target="_blank" rel="noopener">PDF</a>
        <a class="btn alt" id="fxls" target="_blank" rel="noopener">Excel</a>
      </div>
      <p style="margin:14px 0 0" id="fee"></p>
    </section>
  </div>

  <!-- 5. After arrival -->
  <section class="card" id="afterBox">
    <h2 data-t="afterH"></h2>
    <ol class="steps" id="after"></ol>
  </section>

  <!-- 6. Help -->
  <section class="card">
    <h2 data-t="helpH"></h2>
    <p style="margin:0" data-t="helpP"></p>
    <a class="btn" href="tel:0570013904" data-t="call"></a>
    <div class="info" data-t="legal"></div>
  </section>

  <p class="small"><span data-t="disclaimer"></span></p>
</main>

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lang")||"en";
let mine=+(store.get("sp_mine")||0), where=store.get("sp_where")||"coe";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("mine").innerHTML=t.mine.map((n,i)=>`<option value="${i}" ${i===mine?"selected":""}>${esc(n)}</option>`).join("");
  const kind=MINE[mine][1];
  const cls={dep:"yes",jsp:"yes",psp:"mid",no:"no",ask:"mid"}[kind];
  $("verdict").innerHTML=`<div class="verdict ${cls}">${esc(t.v[kind])}${kind==="psp"?`<br><a href="${L.psp}" target="_blank" rel="noopener">${t.pspLink}</a>`:""}</div>`;
  const show=kind==="dep"||kind==="jsp";
  $("whereBox").hidden=!show; $("result").hidden=!show;
  $("afterBox").hidden=!(show&&where==="coe");
  $("where").innerHTML=["coe","chg","ren"].map(w=>`<button data-w="${w}" aria-pressed="${w===where}"><b>${esc(t.where[w][0])}</b>${esc(t.where[w][1])}</button>`).join("");
  $("where").querySelectorAll("button").forEach(b=>b.onclick=()=>{where=b.dataset.w;store.set("sp_where",where);render()});
  if(!show) return;

  $("stepsH").textContent=t.stepsH[where];
  $("steps").innerHTML=t.steps[where].map(s=>`<li><strong>${esc(s[0])}</strong><br><span class="sub">${esc(s[1])}</span>${s[2]?`<br><a href="${s[2]}" target="_blank" rel="noopener">${esc(s[3])}</a>`:""}</li>`).join("");

  const set=DOCS[kind], items=set.items.filter(d=>d.k.includes(where));
  const key=`sp_chk_${kind}_${where}`; let done={};try{done=JSON.parse(store.get(key)||"{}")}catch(e){}
  $("docs").innerHTML=items.map((d,i)=>{const id=`d${i}`,src=t.who[d.src];
    const lk=(l)=>l?` <a href="${l[0]}" target="_blank" rel="noopener">${esc(lang==="ne"?l[2]:l[1])}</a>`:"";
    return `<li><input type="checkbox" id="${id}" data-j="${esc(d.ja)}" ${done[d.ja]?"checked":""}><label for="${id}"><span class="ja">${esc(d.ja)}</span><span class="en">${esc(d[lang])}${lk(d.link)}${lk(d.link2)}</span>${src?`<span class="from">${d.opt?esc(t.optL)+" · ":""}${esc(src)}</span>`:""}</label></li>`}).join("");
  const upd=()=>{$("count").textContent=t.count(items.filter(d=>done[d.ja]).length,items.length)};
  $("docs").querySelectorAll("input").forEach(c=>c.onchange=()=>{done[c.dataset.j]=c.checked;store.set(key,JSON.stringify(done));upd()});
  upd();
  $("rules").innerHTML=t.rules.map(r=>`<li>${esc(r)}</li>`).join("");
  $("offList").href=set.list;

  $("formName").textContent=t.formNames[where];
  $("fpdf").href=C+set.forms[where][0]; $("fxls").href=C+set.forms[where][1];
  $("fee").innerHTML=esc(t.fee[where])+(where==="coe"?"":` <a href="visa.html">${lang==="ne"?"भिसा गाइड":"Visa guide"}</a>`);
  $("after").innerHTML=t.after.map(s=>`<li><strong>${esc(s[0])}</strong><br><span class="sub">${esc(s[1])}</span>${s[2]?`<br><a href="${s[2]}" target="_blank" rel="noopener">${esc(s[3])}</a>`:""}</li>`).join("");
}
$("shareBtn").onclick=()=>sathiShare({text:T[lang].shareMsg,url:location.origin+"/spouse.html"});
$("mine").onchange=e=>{mine=+e.target.value;store.set("sp_mine",mine);render()};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lang",lang);render()});
render();
</script>
</body>
