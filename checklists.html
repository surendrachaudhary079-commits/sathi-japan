<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sathi Japan – Life Checklists</title>
<meta name="theme-color" content="#1B4965">
<style>
  :root{--bg:#F6F4EF;--card:#fff;--ink:#1d2327;--muted:#5f6b73;--line:#e3e0d8;--brand:#1B4965;--ok:#2A9D8F;--late:#D62828;--soon:#E9A23B}
  @media (prefers-color-scheme:dark){:root{--bg:#121619;--card:#1c2226;--ink:#eef1f3;--muted:#9aa6ae;--line:#2b3338;--brand:#8ec5e8}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Noto Sans JP",sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{font-size:22px;margin:0;color:var(--brand)}
  a.back{color:var(--muted);font-size:15px;text-decoration:none}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
  .lang button{border:0;background:transparent;color:var(--ink);padding:8px 12px;font:inherit;font-size:15px;cursor:pointer}
  .lang button[aria-pressed=true]{background:var(--brand);color:var(--bg)}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
  .tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 8px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
  .tabs button[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
  .tabs .ic{font-size:22px;display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  input[type=date]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
  .progress div{height:100%;background:var(--ok);transition:width .2s}
  .count{font-size:14px;color:var(--muted);margin-top:6px}
  ol{list-style:none;margin:0;padding:0}
  li{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:0;padding-top:0}
  li input{width:26px;height:26px;flex-shrink:0;margin-top:2px;accent-color:var(--ok)}
  li.done .txt{color:var(--muted);text-decoration:line-through}
  .txt{margin:0}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:14px}
  .due{padding:2px 10px;border-radius:999px;font-weight:700;color:#fff;background:var(--brand)}
  .due.late{background:var(--late)}.due.soon{background:var(--soon)}.due.none{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
  .meta a{color:var(--muted)}
  .small{font-size:13px;color:var(--muted)}
  .forms{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .forms a,.forms span{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--bg)}
  .forms a{border-color:var(--brand)}
  .forms b{font-size:12px;font-weight:700;color:var(--brand);min-width:44px}
  .forms span{color:var(--muted);border-style:dashed}
</style>
</head>
<body>
<main>
  <a class="back" href="./" data-t="back"></a>
  <header>
    <h1 data-t="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en" aria-pressed="true">EN</button>
      <button data-l="ne" aria-pressed="false">नेपाली</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <section class="card">
    <p class="label" id="keyLabel"></p>
    <input type="date" id="keyDate">
    <p class="count" data-t="dateHelp"></p>
    <div class="progress"><div id="bar"></div></div>
    <p class="count" id="count"></p>
  </section>

  <section class="card"><ol id="steps"></ol></section>

  <p class="small"><span data-t="disclaimer"></span></p>
</main>

<script src="checklists-data.js"></script>
<script>
const T={
 en:{back:"← Home",title:"✅ Life checklists",dateHelp:"Enter the date to see your real deadlines.",done:"done",
  by:"By",from:"From",on:"On",today:"Today",noDeadline:"When you can",official:"Official info ↗",online:"Online",daysLeft:d=>d===0?"today":d>0?`${d} days left`:`${-d} days ago`,
  disclaimer:"General information, not legal, tax or immigration advice. Rules can differ by city; links are for Niigata City. Always check with your ward office or Immigration. Your ticks are saved only on this phone."},
 ne:{back:"← होम",title:"✅ जीवन चेकलिस्ट",dateHelp:"आफ्नो वास्तविक अन्तिम मिति हेर्न मिति राख्नुहोस्।",done:"सकियो",
  by:"सम्म",from:"देखि",on:"मा",today:"आज",noDeadline:"मिल्दो समयमा",official:"आधिकारिक जानकारी ↗",online:"अनलाइन",daysLeft:d=>d===0?"आज":d>0?`${d} दिन बाँकी`:`${-d} दिन अघि`,
  disclaimer:"सामान्य जानकारी मात्र, कानुनी, कर वा भिसा सल्लाह होइन। नियम सिटीअनुसार फरक हुन सक्छ; लिंकहरू निगाता सिटीका हुन्। सधैं वार्ड कार्यालय वा इमिग्रेसनमा जाँच गर्नुहोस्। तपाईंको ठीक चिन्ह यो फोनमा मात्र सेभ हुन्छ।"}
};
const L=window.CHECKLISTS;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("lang2",null)||(()=>{try{return localStorage.getItem("lang")||"en"}catch(e){return "en"}})();
let cur=store.get("cl_cur","moving");
const $=id=>document.getElementById(id);

function jpToday(){return new Date(new Date(Date.now()+9*3600e3).toISOString().slice(0,10)+"T00:00:00Z")}
function addDays(iso,n){const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d}
function fmt(d){return lang==="ne"?`${d.getUTCFullYear()}/${d.getUTCMonth()+1}/${d.getUTCDate()}`:d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}

function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("tabs").innerHTML=L.map(c=>`<button data-id="${c.id}" aria-pressed="${c.id===cur}"><span class="ic">${c.icon}</span>${c.title[lang]}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.id;store.set("cl_cur",cur);render()});
  const c=L.find(x=>x.id===cur);
  $("keyLabel").textContent=c.keyDate[lang];
  const kd=store.get("cl_date_"+cur,"");
  $("keyDate").value=kd;
  const done=store.get("cl_done_"+cur,{});
  const today=jpToday();
  $("steps").innerHTML=c.steps.map(s=>{
    let due;
    if(s.offset===null||!kd){
      due=s.offset===null?`<span class="due none">${t.noDeadline}</span>`:"";
    }else{
      const d=addDays(kd,s.offset), left=Math.round((d-today)/864e5);
      const word=s.offset===0?t.on:s.before?t.from:t.by;
      const label=lang==="ne"?`${fmt(d)} ${word}`:`${word} ${fmt(d)}`;
      const cls=done[s.id]?"":(left<0&&!s.before)?"late":(left<=7&&left>=0)?"soon":"";
      due=`<span class="due ${cls}">${label}</span><span>${t.daysLeft(left)}</span>`;
    }
    const src=s.src?`<a href="${s.src}" target="_blank" rel="noopener">${t.official}</a>`:s.link?`<a href="${s.link}">→</a>`:"";
    const tag={pdf:"PDF",xlsx:"Excel",online:t.online,page:"→"};
    const forms=(s.forms||[]).map(f=>f.kind==="counter"?`<span>🏢 ${f.label[lang]}</span>`:`<a href="${f.url}" ${f.kind==="page"?"":'target="_blank" rel="noopener"'}><b>${tag[f.kind]}</b>${f.label[lang]}</a>`).join("");
    return `<li class="${done[s.id]?"done":""}"><input type="checkbox" data-s="${s.id}" ${done[s.id]?"checked":""} aria-label="${t.done}"><div><p class="txt">${s[lang]}</p><div class="meta">${due}${src}</div>${forms?`<div class="forms">${forms}</div>`:""}</div></li>`;
  }).join("");
  $("steps").querySelectorAll("input").forEach(i=>i.onchange=()=>{const d=store.get("cl_done_"+cur,{});d[i.dataset.s]=i.checked;store.set("cl_done_"+cur,d);render()});
  const n=c.steps.filter(s=>done[s.id]).length;
  $("bar").style.width=(100*n/c.steps.length)+"%";
  $("count").textContent=`${n} / ${c.steps.length} ${t.done}`;
}
$("keyDate").onchange=e=>{store.set("cl_date_"+cur,e.target.value);render()};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}render()});
render();
</script>
</body>
</html>
